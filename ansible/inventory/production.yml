---
# 凌隐宝堂生产环境Ansible清单

all:
  children:
    production:
      hosts:
        web01:
          ansible_host: 10.0.1.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/lybt-prod.pem
          node_role: primary
          
        web02:
          ansible_host: 10.0.1.11
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/lybt-prod.pem
          node_role: secondary
          
        web03:
          ansible_host: 10.0.1.12
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/lybt-prod.pem
          node_role: secondary

      vars:
        # 环境配置
        deploy_environment: production
        domain_name: lybt.com
        
        # 数据库配置
        db_host: 10.0.2.10
        db_user: sa
        db_password: "{{ vault_db_password }}"
        db_sa_password: "{{ vault_db_sa_password }}"
        db_connection_string: "Server={{ db_host }};Database=LYBTDB;User Id={{ db_user }};Password={{ db_password }}"
        
        # Redis配置
        redis_host: 10.0.3.10
        redis_password: "{{ vault_redis_password }}"
        
        # JWT配置
        jwt_secret: "{{ vault_jwt_secret }}"
        
        # 监控配置
        seq_url: http://10.0.4.10:5341
        seq_api_key: "{{ vault_seq_api_key }}"
        jaeger_host: 10.0.4.11
        grafana_password: "{{ vault_grafana_password }}"
        
        # 邮件配置
        smtp_host: smtp.office365.com
        smtp_port: 587
        smtp_user: "{{ vault_smtp_user }}"
        smtp_password: "{{ vault_smtp_password }}"
        
        # 存储配置
        storage_connection_string: "{{ vault_storage_connection_string }}"
        
        # Application Insights
        app_insights_key: "{{ vault_app_insights_key }}"
        
        # CDN配置
        cdn_url: https://cdn.lybt.com
        
        # SSL证书
        ssl_certificate: "{{ vault_ssl_certificate }}"
        ssl_private_key: "{{ vault_ssl_private_key }}"
        
        # 允许的源
        allowed_origins:
          - https://lybt.com
          - https://www.lybt.com
          - https://app.lybt.com
        
        # 后端主机
        backend_hosts:
          - web01
          - web02
          - web03
        
        # 监控IP
        monitoring_ips:
          - 10.0.4.0/24
          - 192.168.1.0/24
        
        # 部署配置
        webapi_replicas: 3
        artifact_path: /artifacts
        
        # 备份配置
        backup_enabled: true
        backup_retention_days: 90
        
        # 通知配置
        notification_webhook: "{{ vault_notification_webhook }}"
        
        # 监控启用标志
        prometheus_enabled: true
        filebeat_enabled: true
        monitoring_enabled: true

    database_servers:
      hosts:
        db01:
          ansible_host: 10.0.2.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/lybt-prod.pem
      vars:
        server_role: database
        
    cache_servers:
      hosts:
        redis01:
          ansible_host: 10.0.3.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/lybt-prod.pem
      vars:
        server_role: cache
        
    monitoring_servers:
      hosts:
        monitor01:
          ansible_host: 10.0.4.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/lybt-prod.pem
      vars:
        server_role: monitoring
---
# 凌隐宝堂回滚剧本 - UltraThink重构生产环境自动化
- name: Rollback LYBT Production Environment
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    project_name: lybt
    environment: "{{ rollback_environment | default('production') }}"
    deployment_path: /opt/lybt
    backup_path: /backup/lybt
    rollback_version: "{{ version | default('previous') }}"
    
  pre_tasks:
    - name: Validate rollback request
      assert:
        that:
          - environment in ['staging', 'production']
          - rollback_version is defined
        fail_msg: "必须指定环境和回滚版本"
    
    - name: Display rollback information
      debug:
        msg:
          - "回滚环境: {{ environment }}"
          - "回滚版本: {{ rollback_version }}"
          - "执行时间: {{ ansible_date_time.iso8601 }}"
          - "目标主机: {{ inventory_hostname }}"
    
    - name: Confirm rollback
      pause:
        prompt: "确认回滚到版本 {{ rollback_version }}? (yes/no)"
      register: rollback_confirm
      when: environment == 'production'
    
    - name: Check confirmation
      fail:
        msg: "回滚操作已取消"
      when: 
        - environment == 'production'
        - rollback_confirm.user_input != 'yes'
  
  tasks:
    # ==================== 检查回滚版本 ====================
    - name: Check rollback version
      block:
        - name: List available versions
          find:
            paths: "{{ deployment_path }}/releases"
            file_type: directory
          register: available_versions
        
        - name: Display available versions
          debug:
            msg: "可用版本: {{ available_versions.files | map(attribute='path') | map('basename') | list }}"
        
        - name: Check if rollback version exists
          stat:
            path: "{{ deployment_path }}/releases/{{ rollback_version }}"
          register: rollback_version_check
          when: rollback_version != 'previous'
        
        - name: Fail if version not found
          fail:
            msg: "版本 {{ rollback_version }} 不存在"
          when: 
            - rollback_version != 'previous'
            - not rollback_version_check.stat.exists
        
        - name: Get previous version
          shell: |
            ls -t {{ deployment_path }}/releases | head -2 | tail -1
          register: previous_version_result
          when: rollback_version == 'previous'
        
        - name: Set rollback version to previous
          set_fact:
            actual_rollback_version: "{{ previous_version_result.stdout }}"
          when: rollback_version == 'previous'
        
        - name: Set actual rollback version
          set_fact:
            actual_rollback_version: "{{ rollback_version }}"
          when: rollback_version != 'previous'
    
    # ==================== 创建回滚点 ====================
    - name: Create rollback point
      block:
        - name: Get current version
          command: readlink {{ deployment_path }}/current
          register: current_version
          ignore_errors: yes
        
        - name: Backup current state
          shell: |
            tar -czf {{ backup_path }}/rollback-{{ ansible_date_time.epoch }}.tar.gz \
              -C {{ deployment_path }} current
          when: current_version.rc == 0
          ignore_errors: yes
        
        - name: Save current configuration
          copy:
            src: "{{ item }}"
            dest: "{{ backup_path }}/config-{{ ansible_date_time.epoch }}-{{ item | basename }}"
            remote_src: yes
            backup: yes
          loop:
            - /etc/lybt/.env
            - "{{ deployment_path }}/docker-compose.yml"
          ignore_errors: yes
    
    # ==================== 停止当前服务 ====================
    - name: Stop current services
      block:
        - name: Stop Docker containers
          docker_compose:
            project_src: "{{ deployment_path }}"
            state: absent
          ignore_errors: yes
        
        - name: Wait for services to stop
          wait_for:
            port: "{{ item }}"
            state: stopped
            timeout: 60
          loop:
            - 5000
            - 5001
            - 80
            - 443
          ignore_errors: yes
    
    # ==================== 执行回滚 ====================
    - name: Perform rollback
      block:
        - name: Switch to rollback version
          file:
            src: "{{ deployment_path }}/releases/{{ actual_rollback_version }}"
            dest: "{{ deployment_path }}/current"
            state: link
            force: yes
        
        - name: Restore configuration from rollback version
          copy:
            src: "{{ deployment_path }}/releases/{{ actual_rollback_version }}/config/.env"
            dest: /etc/lybt/.env
            remote_src: yes
            backup: yes
          ignore_errors: yes
        
        - name: Restore Docker Compose configuration
          copy:
            src: "{{ deployment_path }}/releases/{{ actual_rollback_version }}/docker-compose.yml"
            dest: "{{ deployment_path }}/docker-compose.yml"
            remote_src: yes
            backup: yes
          ignore_errors: yes
    
    # ==================== 数据库回滚 ====================
    - name: Database rollback
      block:
        - name: Check for database migrations
          shell: |
            docker run --rm \
              --network host \
              -e ConnectionStrings__DefaultConnection="{{ db_connection_string }}" \
              lybt/webapi:{{ actual_rollback_version }} \
              dotnet ef migrations list
          register: migration_list
          ignore_errors: yes
        
        - name: Rollback database migrations
          shell: |
            docker run --rm \
              --network host \
              -e ConnectionStrings__DefaultConnection="{{ db_connection_string }}" \
              lybt/webapi:{{ actual_rollback_version }} \
              dotnet ef database update {{ rollback_migration | default('0') }}
          when: 
            - rollback_database | default(false)
            - migration_list.rc == 0
          register: db_rollback_result
        
        - name: Display database rollback result
          debug:
            var: db_rollback_result.stdout_lines
          when: db_rollback_result is defined
    
    # ==================== 启动回滚版本 ====================
    - name: Start rollback version
      block:
        - name: Pull Docker images for rollback version
          docker_image:
            name: "lybt/webapi:{{ actual_rollback_version }}"
            source: pull
            force_source: yes
        
        - name: Start Docker containers
          docker_compose:
            project_src: "{{ deployment_path }}"
            state: present
            pull: no
            recreate: always
          environment:
            DEPLOY_VERSION: "{{ actual_rollback_version }}"
            ENVIRONMENT: "{{ environment }}"
        
        - name: Wait for services to be healthy
          uri:
            url: "http://localhost/health"
            status_code: 200
          register: health_check
          until: health_check.status == 200
          retries: 30
          delay: 10
    
    # ==================== 验证回滚 ====================
    - name: Verify rollback
      block:
        - name: Check API health
          uri:
            url: "http://localhost/api/v1/health"
            method: GET
            status_code: 200
          register: api_health
        
        - name: Check service version
          uri:
            url: "http://localhost/api/v1/version"
            method: GET
          register: version_check
        
        - name: Run smoke tests
          uri:
            url: "http://localhost/api/v1/{{ item }}"
            method: GET
            status_code: [200, 401]
          loop:
            - auth/login
            - patients
            - herbs
          register: smoke_tests
        
        - name: Display verification results
          debug:
            msg:
              - "API健康状态: {{ api_health.status }}"
              - "当前版本: {{ version_check.json.version | default('unknown') }}"
              - "冒烟测试: {{ smoke_tests.results | length }}项通过"
    
    # ==================== 清理 ====================
    - name: Cleanup
      block:
        - name: Clean Docker system
          shell: |
            docker system prune -af --volumes
          when: cleanup_docker | default(false)
        
        - name: Remove old rollback points (keep last 10)
          shell: |
            ls -t {{ backup_path }}/rollback-*.tar.gz | tail -n +11 | xargs rm -f
          ignore_errors: yes
  
  post_tasks:
    # ==================== 通知 ====================
    - name: Send rollback notification
      uri:
        url: "{{ notification_webhook }}"
        method: POST
        body_format: json
        body:
          text: "回滚完成通知"
          environment: "{{ environment }}"
          rollback_version: "{{ actual_rollback_version }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          host: "{{ inventory_hostname }}"
          status: "success"
      when: notification_webhook is defined
      ignore_errors: yes
    
    - name: Update rollback record
      lineinfile:
        path: "{{ deployment_path }}/rollbacks.log"
        line: "{{ ansible_date_time.iso8601 }} | {{ environment }} | {{ actual_rollback_version }} | {{ ansible_user }} | SUCCESS"
        create: yes
    
    - name: Display rollback summary
      debug:
        msg:
          - "================================"
          - "回滚成功完成!"
          - "环境: {{ environment }}"
          - "回滚版本: {{ actual_rollback_version }}"
          - "时间: {{ ansible_date_time.iso8601 }}"
          - "================================"
  
  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
    
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
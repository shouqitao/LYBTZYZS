# 凌隐宝堂中医诊所管理系统 - Docker Compose配置
# UltraThink重构容器化部署架构

version: '3.8'

services:
  # ==================== 数据库服务 ====================
  lybt-database:
    build:
      context: .
      dockerfile: Docker/Dockerfile.database
    container_name: lybt-database
    hostname: lybt-database
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=LYBT@AdminPassword2024
      - MSSQL_PID=Developer
      - MSSQL_TCP_PORT=1433
      - MSSQL_COLLATION=Chinese_PRC_CI_AS
      - TZ=Asia/Shanghai
    ports:
      - "1433:1433"
    volumes:
      - lybt_database_data:/var/opt/mssql/data
      - lybt_database_logs:/var/opt/mssql/log
      - lybt_database_backup:/var/opt/mssql/backup
    networks:
      - lybt-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -Q "SELECT 1" -b -o /dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== Redis缓存服务 ====================
  lybt-redis:
    image: redis:7-alpine
    container_name: lybt-redis
    hostname: lybt-redis
    command: redis-server --appendonly yes --requirepass "LYBT@Redis2024"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - lybt_redis_data:/data
    networks:
      - lybt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Web API服务 ====================
  lybt-webapi:
    build:
      context: .
      dockerfile: Docker/Dockerfile.webapi
    container_name: lybt-webapi
    hostname: lybt-webapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - TZ=Asia/Shanghai
      - DOTNET_PRINT_TELEMETRY_MESSAGE=false
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      # 数据库连接字符串
      - ConnectionStrings__DefaultConnection=Server=lybt-database,1433;Database=LYBTDB;User Id=lybt_app_user;Password=LybtApp@2024!;TrustServerCertificate=true;
      # Redis连接字符串
      - ConnectionStrings__Redis=lybt-redis:6379,password=LYBT@Redis2024
      # JWT配置
      - JWT__Secret=LYBT@JWT@Secret@Key@2024@UltraThink@Refactor
      - JWT__Issuer=LYBT.WebAPI
      - JWT__Audience=LYBT.Client
      - JWT__ExpirationHours=8
      - JWT__RememberMeExpirationDays=30
      # 性能监控配置
      - Performance__EnableMetrics=true
      - Performance__SlowQueryThresholdMs=500
      - Performance__SlowCommandThresholdMs=1000
      - Performance__CriticalThresholdMs=2000
      # 缓存配置
      - Cache__DefaultExpirationMinutes=30
      - Cache__SlidingExpirationMinutes=15
      - Cache__MaxSize=1000
      # 日志配置
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__System=Warning
    ports:
      - "5000:5000"
    volumes:
      - lybt_webapi_logs:/app/logs
      - lybt_webapi_uploads:/app/uploads
    networks:
      - lybt-network
    depends_on:
      lybt-database:
        condition: service_healthy
      lybt-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/performance/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ==================== Nginx反向代理 ====================
  lybt-nginx:
    image: nginx:alpine
    container_name: lybt-nginx
    hostname: lybt-nginx
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./Docker/nginx/ssl:/etc/nginx/ssl:ro
      - lybt_nginx_logs:/var/log/nginx
    networks:
      - lybt-network
    depends_on:
      - lybt-webapi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Seq日志服务 ====================
  lybt-seq:
    image: datalust/seq:latest
    container_name: lybt-seq
    hostname: lybt-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=QiJAJhFKPh8JcxZ1+3YY7FK5KLcvjyixDfQUj5MzpwSEcFxVRb4cBBXNsrLFDyaHFnXnM2lJz+HRtcX5G0MzYlLVqQKg4g=
      - TZ=Asia/Shanghai
    ports:
      - "5341:80"
    volumes:
      - lybt_seq_data:/data
    networks:
      - lybt-network
    restart: unless-stopped

  # ==================== Prometheus监控 ====================
  lybt-prometheus:
    image: prom/prometheus:latest
    container_name: lybt-prometheus
    hostname: lybt-prometheus
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "9090:9090"
    volumes:
      - ./Docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - lybt_prometheus_data:/prometheus
    networks:
      - lybt-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # ==================== Grafana监控面板 ====================
  lybt-grafana:
    image: grafana/grafana:latest
    container_name: lybt-grafana
    hostname: lybt-grafana
    environment:
      - TZ=Asia/Shanghai
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=LYBT@Grafana2024
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
    ports:
      - "3000:3000"
    volumes:
      - lybt_grafana_data:/var/lib/grafana
      - ./Docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - lybt-network
    depends_on:
      - lybt-prometheus
    restart: unless-stopped

  # ==================== Portainer容器管理 ====================
  lybt-portainer:
    image: portainer/portainer-ce:latest
    container_name: lybt-portainer
    hostname: lybt-portainer
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - lybt_portainer_data:/data
    networks:
      - lybt-network
    restart: unless-stopped

# ==================== 数据卷定义 ====================
volumes:
  # 数据库相关
  lybt_database_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/database
  lybt_database_logs:
    driver: local
  lybt_database_backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/backup

  # Redis数据
  lybt_redis_data:
    driver: local

  # Web API相关
  lybt_webapi_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/webapi
  lybt_webapi_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/uploads

  # Nginx日志
  lybt_nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/nginx

  # 监控相关
  lybt_seq_data:
    driver: local
  lybt_prometheus_data:
    driver: local
  lybt_grafana_data:
    driver: local
  lybt_portainer_data:
    driver: local

# ==================== 网络定义 ====================
networks:
  lybt-network:
    driver: bridge
    name: lybt-network
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
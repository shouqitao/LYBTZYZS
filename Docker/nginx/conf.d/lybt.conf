# 凌隐宝堂站点配置 - UltraThink重构Web服务配置

# ==================== HTTP重定向到HTTPS ====================
server {
    listen 80;
    server_name lybt.local localhost 127.0.0.1;
    return 301 https://$server_name$request_uri;
}

# ==================== HTTPS主站点 ====================
server {
    listen 443 ssl http2;
    server_name lybt.local localhost 127.0.0.1;

    # ==================== SSL配置 ====================
    ssl_certificate /etc/nginx/ssl/lybt.crt;
    ssl_certificate_key /etc/nginx/ssl/lybt.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozTLS:10m;
    ssl_session_tickets off;

    # 现代SSL配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ==================== API代理配置 ====================
    # 认证API限流
    location /api/v1/auth {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://lybt_webapi;
        include /etc/nginx/conf.d/proxy_params.conf;
        
        # 认证接口特殊处理
        proxy_read_timeout 30s;
    }

    # 一般API限流
    location /api {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://lybt_webapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # 性能监控API（管理员专用）
    location /api/v1/performance {
        # IP白名单（可根据需要调整）
        # allow 172.20.0.0/16;
        # allow 127.0.0.1;
        # deny all;
        
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://lybt_webapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Swagger文档（开发环境）
    location /swagger {
        # 生产环境可以注释掉这个location块
        proxy_pass http://lybt_webapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ==================== 静态文件服务 ====================
    location /static {
        alias /var/www/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads {
        alias /var/www/uploads;
        expires 30d;
        add_header Cache-Control "public";
        
        # 安全限制
        location ~* \.(php|jsp|asp|sh|py|pl)$ {
            deny all;
        }
    }

    # ==================== 默认路由 ====================
    location / {
        limit_req zone=general burst=200 nodelay;
        proxy_pass http://lybt_webapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ==================== 错误页面 ====================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location = /404.html {
        root /usr/share/nginx/html;
    }

    # ==================== 监控和健康检查 ====================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.20.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # ==================== 安全配置 ====================
    # 隐藏Nginx版本
    server_tokens off;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问备份文件
    location ~* \.(bak|backup|old|orig|original|test|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 限制HTTP方法
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }
}

# ==================== 管理端口配置 ====================
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    
    # 仅允许内网访问
    allow 172.20.0.0/16;
    allow 127.0.0.1;
    deny all;

    # 管理员API访问
    location /admin {
        proxy_pass http://lybt_webapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # 容器状态
    location /container-status {
        return 200 '{"status":"running","nginx":"ok","upstream":"checking"}';
        add_header Content-Type application/json;
    }
}
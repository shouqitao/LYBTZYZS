# ================================================
# 凌隐宝堂中医诊所系统 - Docker Compose配置
# UltraThink Stage 5.3.3
# ================================================

version: '3.8'

services:
  # SQL Server数据库服务
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lybt-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin@123456
      - MSSQL_PID=Express
      - MSSQL_LCID=2052  # 中文
      - MSSQL_COLLATION=Chinese_PRC_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./Database/Scripts:/docker-entrypoint-initdb.d
    networks:
      - lybt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Admin@123456", "-Q", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: lybt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lybt-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "Redis@123456"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 后端API服务
  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: lybt-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=LYBTDB;User Id=sa;Password=Admin@123456;TrustServerCertificate=True
      - Redis__ConnectionString=redis:6379,password=Redis@123456
      - Jwt__SecretKey=LYBT_JWT_SECRET_KEY_2025_PRODUCTION
      - Jwt__Issuer=LYBT.WebAPI
      - Jwt__Audience=LYBT.Client
      - Jwt__ExpireMinutes=480
    ports:
      - "7001:443"
      - "5001:80"
    volumes:
      - ./Logs:/app/logs
      - ./Config:/app/config
      - ./Assets:/app/assets
    depends_on:
      - sqlserver
      - redis
    networks:
      - lybt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: lybt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Docker/ssl:/etc/nginx/ssl:ro
      - ./Frontend/Web/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - lybt-network
    restart: unless-stopped

  # 监控服务 - Prometheus（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: lybt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./Docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - lybt-network
    restart: unless-stopped

  # 监控面板 - Grafana（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: lybt-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=Admin@123456
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./Docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./Docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - lybt-network
    restart: unless-stopped

  # 日志收集 - Seq（可选）
  seq:
    image: datalust/seq:latest
    container_name: lybt-seq
    ports:
      - "5341:80"
      - "5342:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=Admin@123456
    volumes:
      - seq-data:/data
    networks:
      - lybt-network
    restart: unless-stopped

# 网络配置
networks:
  lybt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  sqlserver-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  seq-data:
    driver: local
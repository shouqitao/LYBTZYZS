# 凌隐宝堂告警规则配置 - UltraThink重构监控告警架构

groups:
  # ==================== 系统资源告警 ====================
  - name: system-alerts
    rules:
      - alert: HighCPUUsage
        expr: cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          service: lybt-system
        annotations:
          summary: "系统CPU使用率过高"
          description: "系统CPU使用率超过80%，持续5分钟。当前值: {{ $value }}%"

      - alert: CriticalCPUUsage
        expr: cpu_usage_percent > 90
        for: 2m
        labels:
          severity: critical
          service: lybt-system
        annotations:
          summary: "系统CPU使用率严重过高"
          description: "系统CPU使用率超过90%，持续2分钟。当前值: {{ $value }}%"

      - alert: HighMemoryUsage
        expr: memory_usage_percent > 85
        for: 5m
        labels:
          severity: warning
          service: lybt-system
        annotations:
          summary: "系统内存使用率过高"
          description: "系统内存使用率超过85%，持续5分钟。当前值: {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: memory_usage_percent > 95
        for: 1m
        labels:
          severity: critical
          service: lybt-system
        annotations:
          summary: "系统内存使用率严重过高"
          description: "系统内存使用率超过95%，持续1分钟。当前值: {{ $value }}%"

      - alert: DiskSpaceLow
        expr: disk_free_percent < 20
        for: 5m
        labels:
          severity: warning
          service: lybt-system
        annotations:
          summary: "磁盘空间不足"
          description: "磁盘剩余空间低于20%。当前剩余: {{ $value }}%"

      - alert: DiskSpaceCritical
        expr: disk_free_percent < 10
        for: 1m
        labels:
          severity: critical
          service: lybt-system
        annotations:
          summary: "磁盘空间严重不足"
          description: "磁盘剩余空间低于10%。当前剩余: {{ $value }}%"

  # ==================== Web API服务告警 ====================
  - name: webapi-alerts
    rules:
      - alert: APIServiceDown
        expr: up{job="lybt-webapi"} == 0
        for: 1m
        labels:
          severity: critical
          service: lybt-webapi
        annotations:
          summary: "Web API服务不可用"
          description: "LYBT Web API服务已下线超过1分钟"

      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="lybt-webapi"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: lybt-webapi
        annotations:
          summary: "API响应时间过长"
          description: "95%的API请求响应时间超过2秒，持续5分钟。当前值: {{ $value }}s"

      - alert: CriticalAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="lybt-webapi"}[5m])) > 5
        for: 2m
        labels:
          severity: critical
          service: lybt-webapi
        annotations:
          summary: "API响应时间严重过长"
          description: "95%的API请求响应时间超过5秒，持续2分钟。当前值: {{ $value }}s"

      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{job="lybt-webapi", code=~"5.."}[5m]) / rate(http_requests_total{job="lybt-webapi"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: lybt-webapi
        annotations:
          summary: "API错误率过高"
          description: "API 5xx错误率超过5%，持续5分钟。当前错误率: {{ $value | humanizePercentage }}"

      - alert: CriticalAPIErrorRate
        expr: rate(http_requests_total{job="lybt-webapi", code=~"5.."}[5m]) / rate(http_requests_total{job="lybt-webapi"}[5m]) > 0.10
        for: 2m
        labels:
          severity: critical
          service: lybt-webapi
        annotations:
          summary: "API错误率严重过高"
          description: "API 5xx错误率超过10%，持续2分钟。当前错误率: {{ $value | humanizePercentage }}"

      - alert: APIRequestsSpike
        expr: rate(http_requests_total{job="lybt-webapi"}[5m]) > 1000
        for: 2m
        labels:
          severity: warning
          service: lybt-webapi
        annotations:
          summary: "API请求量异常增长"
          description: "API请求率超过每秒1000次，持续2分钟。当前值: {{ $value }} req/s"

  # ==================== 数据库告警 ====================
  - name: database-alerts
    rules:
      - alert: DatabaseServiceDown
        expr: up{job="lybt-database"} == 0
        for: 1m
        labels:
          severity: critical
          service: lybt-database
        annotations:
          summary: "数据库服务不可用"
          description: "SQL Server数据库服务已下线超过1分钟"

      - alert: DatabaseHighConnections
        expr: sqlserver_connections > 80
        for: 5m
        labels:
          severity: warning
          service: lybt-database
        annotations:
          summary: "数据库连接数过高"
          description: "数据库当前连接数超过80，持续5分钟。当前值: {{ $value }}"

      - alert: DatabaseSlowQueries
        expr: sqlserver_slow_queries_per_sec > 10
        for: 5m
        labels:
          severity: warning
          service: lybt-database
        annotations:
          summary: "数据库慢查询过多"
          description: "每秒慢查询数量超过10，持续5分钟。当前值: {{ $value }}"

      - alert: DatabaseDeadlocks
        expr: increase(sqlserver_deadlocks_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
          service: lybt-database
        annotations:
          summary: "数据库死锁频繁"
          description: "5分钟内发生死锁超过5次。总计: {{ $value }}"

      - alert: DatabaseBackupFailed
        expr: time() - sqlserver_last_backup_timestamp > 86400
        for: 1m
        labels:
          severity: critical
          service: lybt-database
        annotations:
          summary: "数据库备份失败"
          description: "数据库备份超过24小时未执行"

  # ==================== Redis缓存告警 ====================
  - name: redis-alerts
    rules:
      - alert: RedisServiceDown
        expr: up{job="lybt-redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: lybt-redis
        annotations:
          summary: "Redis缓存服务不可用"
          description: "Redis缓存服务已下线超过1分钟"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          service: lybt-redis
        annotations:
          summary: "Redis内存使用率过高"
          description: "Redis内存使用率超过80%，持续5分钟。当前值: {{ $value | humanizePercentage }}"

      - alert: RedisConnectionsHigh
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          service: lybt-redis
        annotations:
          summary: "Redis连接数过高"
          description: "Redis当前连接数超过100，持续5分钟。当前值: {{ $value }}"

      - alert: RedisSlowOperations
        expr: redis_slowlog_length > 10
        for: 5m
        labels:
          severity: warning
          service: lybt-redis
        annotations:
          summary: "Redis慢操作过多"
          description: "Redis慢查询日志数量超过10，持续5分钟。当前值: {{ $value }}"

  # ==================== 安全告警 ====================
  - name: security-alerts
    rules:
      - alert: SecurityBruteForceAttack
        expr: increase(security_login_failures_total[5m]) > 20
        for: 1m
        labels:
          severity: critical
          service: lybt-security
        annotations:
          summary: "检测到暴力破解攻击"
          description: "5分钟内登录失败次数超过20次，疑似暴力破解攻击"

      - alert: SecurityAbnormalTraffic
        expr: rate(http_requests_total[1m]) > 2000
        for: 2m
        labels:
          severity: warning
          service: lybt-security
        annotations:
          summary: "异常流量检测"
          description: "每秒请求数超过2000，持续2分钟。当前值: {{ $value }} req/s"

      - alert: SecurityRateLimitTriggered
        expr: increase(rate_limit_blocked_total[5m]) > 100
        for: 1m
        labels:
          severity: warning
          service: lybt-security
        annotations:
          summary: "限流器频繁触发"
          description: "5分钟内被限流阻止的请求超过100次"

      - alert: SecurityUnauthorizedAccess
        expr: rate(http_requests_total{code="401"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: lybt-security
        annotations:
          summary: "未授权访问频繁"
          description: "每秒未授权访问（401错误）超过10次，持续5分钟"

  # ==================== 业务告警 ====================
  - name: business-alerts
    rules:
      - alert: HighPatientRegistration
        expr: rate(patient_registrations_total[1h]) > 100
        for: 10m
        labels:
          severity: info
          service: lybt-business
        annotations:
          summary: "患者挂号量异常增高"
          description: "1小时内患者挂号量超过100，可能需要增加医生资源"

      - alert: LowSystemUsage
        expr: rate(http_requests_total{job="lybt-webapi"}[1h]) < 10
        for: 30m
        labels:
          severity: info
          service: lybt-business
        annotations:
          summary: "系统使用量偏低"
          description: "1小时内API请求率低于每秒10次，持续30分钟"

      - alert: DataIntegrityIssue
        expr: increase(database_constraint_violations_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: lybt-business
        annotations:
          summary: "数据完整性问题"
          description: "检测到数据库约束违反，可能存在数据完整性问题"

  # ==================== 监控系统自身告警 ====================
  - name: monitoring-alerts
    rules:
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
          service: monitoring
        annotations:
          summary: "Prometheus监控服务不可用"
          description: "Prometheus服务已下线超过1分钟"

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Grafana可视化服务不可用"
          description: "Grafana服务已下线超过2分钟"

      - alert: AlertManagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
          service: monitoring
        annotations:
          summary: "告警管理器不可用"
          description: "AlertManager服务已下线超过1分钟"
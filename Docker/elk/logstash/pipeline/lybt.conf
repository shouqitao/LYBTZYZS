# 凌隐宝堂日志处理配置 - UltraThink重构日志架构

input {
  # 接收来自Filebeat的日志
  beats {
    port => 5044
  }
  
  # 接收Web API日志
  tcp {
    port => 5045
    codec => json_lines
  }
  
  # 接收系统日志
  syslog {
    port => 5046
  }
  
  # 接收安全审计日志
  http {
    port => 8080
    codec => json
  }
}

filter {
  # 添加时间戳
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # 处理Web API日志
  if [fields][log_type] == "webapi" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{LOGLEVEL:log_level}\] %{DATA:logger_name}: %{GREEDYDATA:log_message}"
      }
    }
    
    # 解析JSON格式的结构化日志
    if [log_message] =~ /^\{.*\}$/ {
      json {
        source => "log_message"
        target => "structured_data"
      }
    }
    
    # 设置日志级别
    if [log_level] == "Error" {
      mutate {
        add_tag => ["error", "alert"]
        add_field => { "severity" => "high" }
      }
    }
    
    if [log_level] == "Warning" {
      mutate {
        add_tag => ["warning"]
        add_field => { "severity" => "medium" }
      }
    }
    
    if [log_level] == "Information" {
      mutate {
        add_tag => ["info"]
        add_field => { "severity" => "low" }
      }
    }
  }
  
  # 处理安全审计日志
  if [fields][log_type] == "security" {
    # 解析安全事件
    grok {
      match => {
        "message" => "(?<security_event_type>LOGIN_ATTEMPT|API_ACCESS|DATA_ACCESS|SECURITY_EXCEPTION) - User: %{DATA:username} - IP: %{IP:client_ip} - %{GREEDYDATA:security_message}"
      }
    }
    
    # 标记高风险安全事件
    if [security_event_type] == "SECURITY_EXCEPTION" {
      mutate {
        add_tag => ["security", "high_risk", "alert"]
        add_field => { "alert_priority" => "critical" }
      }
    }
    
    # 检测可疑IP
    if [client_ip] and [client_ip] !~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|127\.0\.0\.1)/ {
      mutate {
        add_tag => ["external_ip", "review_required"]
      }
    }
    
    # 检测暴力破解攻击
    if [security_event_type] == "LOGIN_ATTEMPT" and [security_message] =~ /(?i)fail/ {
      mutate {
        add_tag => ["login_failure", "potential_attack"]
      }
      
      # 使用聚合检测频繁失败
      aggregate {
        task_id => "%{client_ip}_login_failures"
        code => "
          map['failure_count'] ||= 0
          map['failure_count'] += 1
          if map['failure_count'] >= 5
            event.set('brute_force_detected', true)
            event.tag('brute_force_attack')
            event.tag('critical_security_alert')
          end
        "
        map_action => "update"
      }
    }
  }
  
  # 处理数据库日志
  if [fields][log_type] == "database" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:db_timestamp}.*spid%{NUMBER:session_id}.*%{GREEDYDATA:db_message}"
      }
    }
    
    # 检测慢查询
    if [db_message] =~ /(?i)(duration|time).*([1-9][0-9]{3,}|[5-9][0-9]{2})/ {
      mutate {
        add_tag => ["slow_query", "performance"]
        add_field => { "performance_impact" => "high" }
      }
    }
    
    # 检测死锁
    if [db_message] =~ /(?i)deadlock/ {
      mutate {
        add_tag => ["deadlock", "database_issue", "alert"]
        add_field => { "alert_priority" => "high" }
      }
    }
    
    # 检测连接池问题
    if [db_message] =~ /(?i)(connection.*pool|pool.*exhausted)/ {
      mutate {
        add_tag => ["connection_pool", "resource_issue", "alert"]
        add_field => { "alert_priority" => "high" }
      }
    }
  }
  
  # 处理应用性能日志
  if [fields][log_type] == "performance" {
    grok {
      match => {
        "message" => "PERF - %{DATA:operation_name} - Duration: %{NUMBER:duration_ms}ms - %{GREEDYDATA:perf_details}"
      }
    }
    
    # 转换持续时间为数字
    mutate {
      convert => { "duration_ms" => "integer" }
    }
    
    # 标记慢操作
    if [duration_ms] and [duration_ms] > 2000 {
      mutate {
        add_tag => ["slow_operation", "performance_issue"]
        add_field => { "performance_category" => "slow" }
      }
    }
    
    if [duration_ms] and [duration_ms] > 5000 {
      mutate {
        add_tag => ["very_slow_operation", "alert"]
        add_field => { "alert_priority" => "medium" }
      }
    }
  }
  
  # 地理位置解析
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      database => "/usr/share/logstash/GeoLite2-City.mmdb"
    }
  }
  
  # 用户代理解析
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # 添加环境标识
  mutate {
    add_field => {
      "environment" => "production"
      "system" => "lybt"
      "processed_at" => "%{@timestamp}"
    }
  }
  
  # 数据清理
  mutate {
    remove_field => ["host", "agent", "@version"]
  }
  
  # 时间戳规范化
  date {
    match => ["log_timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  # 根据日志类型输出到不同的Elasticsearch索引
  if "webapi" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "lybt-webapi-%{+YYYY.MM.dd}"
      template_name => "lybt-webapi"
      template => "/usr/share/logstash/templates/lybt-webapi-template.json"
      template_overwrite => true
    }
  }
  
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "lybt-security-%{+YYYY.MM.dd}"
      template_name => "lybt-security"
      template => "/usr/share/logstash/templates/lybt-security-template.json"
      template_overwrite => true
    }
  }
  
  if "database" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "lybt-database-%{+YYYY.MM.dd}"
    }
  }
  
  if "performance" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "lybt-performance-%{+YYYY.MM.dd}"
    }
  }
  
  # 默认输出
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "lybt-general-%{+YYYY.MM.dd}"
  }
  
  # 关键告警发送到告警系统
  if "alert" in [tags] {
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      content_type => "application/json"
      format => "json"
      mapping => {
        "receiver" => "logstash-alerts"
        "status" => "firing"
        "alerts" => [
          {
            "labels" => {
              "alertname" => "LogstashAlert"
              "service" => "lybt-logs"
              "severity" => "%{alert_priority}"
              "log_type" => "%{[fields][log_type]}"
            }
            "annotations" => {
              "summary" => "日志告警: %{message}"
              "description" => "检测到重要日志事件: %{message}"
            }
            "startsAt" => "%{@timestamp}"
          }
        ]
      }
    }
  }
  
  # 调试输出（开发环境）
  if [fields][debug] == "true" {
    stdout {
      codec => rubydebug
    }
  }
}
# 凌隐宝堂Logstash配置 - UltraThink重构日志处理引擎

# 节点配置
node.name: lybt-logstash-01
path.data: /usr/share/logstash/data
path.logs: /usr/share/logstash/logs
path.settings: /usr/share/logstash/config

# 管道配置
pipeline.id: lybt-main
pipeline.workers: 4
pipeline.output.workers: 2
pipeline.batch.size: 1000
pipeline.batch.delay: 10

# 队列配置
queue.type: memory
queue.page_capacity: 64mb
queue.max_events: 0
queue.max_bytes: 1024mb
queue.checkpoint.acks: 1024
queue.checkpoint.writes: 1024
queue.checkpoint.interval: 1000
queue.drain: false

# HTTP API配置
http.host: "0.0.0.0"
http.port: 9600

# 日志配置
log.level: info
log.format: json
slowlog.threshold.warn: 2s
slowlog.threshold.info: 1s
slowlog.threshold.debug: 500ms
slowlog.threshold.trace: 100ms

# 死信队列配置
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: 1024mb

# 配置重载
config.reload.automatic: true
config.reload.interval: 3s
config.support_escapes: false

# 指标配置
monitoring.enabled: true
monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
monitoring.collection.interval: 10s

# X-Pack配置
xpack.monitoring.enabled: false
xpack.management.enabled: false

# 管道配置文件路径
path.config: /usr/share/logstash/pipeline

# JVM设置
# 这些设置在docker-compose中通过环境变量设置
# -Xms2g -Xmx2g

# GC配置
# -XX:+UseG1GC
# -XX:+UseCompressedOops
# -XX:+DisableExplicitGC

# 安全配置
allow_superuser: false

# API配置
api.http.host: 0.0.0.0
api.http.port: 9600
api.environment: production
api.auth.type: none

# 插件管理
plugin_classpath: []

# 管道统计
pipeline.stats.enabled: true

# 模块配置
modules:
  - name: netflow
    var.input.udp.port: 2055
    enabled: false
    
  - name: azure_module
    enabled: false

# 性能调优
pipeline.unsafe_shutdown: false
pipeline.plugin_classloaders: false
pipeline.separate_logs: false

# 字段引用解析器
config.field_reference.parser: "STRICT"

# Java执行引擎
pipeline.java_execution: true
pipeline.plugin_classloaders: false
name: 功能请求
description: 为这个项目提出一个新功能
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您的功能建议！请填写以下信息帮助我们理解您的需求。

  - type: textarea
    id: problem
    attributes:
      label: 相关问题描述
      description: 您的功能请求是否与某个问题相关？请清晰简洁地描述
      placeholder: 例如：我总是在...时感到困扰
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 清晰简洁地描述您想要的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 描述您考虑过的任何替代解决方案或功能

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 您认为这个功能的优先级如何？
      options:
        - 低 - 很好但不是必需的
        - 中 - 会显著改善体验
        - 高 - 对日常使用至关重要
    validations:
      required: true

  - type: dropdown
    id: affected-modules
    attributes:
      label: 影响的模块
      description: 选择会受到影响的模块（可多选）
      multiple: true
      options:
        - Web API
        - WPF 客户端
        - 用户管理
        - 患者管理
        - 药材管理
        - 看诊管理
        - 处方管理
        - 报表系统
        - 权限管理
        - 其他

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 提供一个或多个使用场景来说明这个功能如何使用
      placeholder: |
        作为一名医生，
        我想要能够...
        这样我就可以...

  - type: textarea
    id: mockups
    attributes:
      label: 界面设计建议
      description: 如果适用，请添加草图、线框图或设计建议

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 验收标准（Acceptance Criteria）
      description: 明确可验证的完成条件（建议使用清单）
      placeholder: |
        - [ ] 新增 API 路由与契约按文档实现
        - [ ] 单元/集成测试覆盖主要场景
        - [ ] 相关文档（README/architecture）已更新
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        提示：提交 PR 时在描述中使用 Fixes/Closes/Resolves #<issue> 可在合并后自动关闭 Issue，并保持项目看板同步。

  - type: textarea
    id: additional-context
    attributes:
      label: 附加说明
      description: 添加关于功能请求的任何其他上下文或截图

name: PR ↔ Issue Status Sync

on:
  pull_request:
    types: [opened, edited, synchronize, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Sync PR with referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = (pr.body || '');

            const ensureLabel = async (name, color = 'cfd3d7', description = '') => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color, description }); }
            };
            await ensureLabel('status: in-progress', 'fbca04', 'In Progress');
            await ensureLabel('status: done', '0e8a16', 'Done');

            const numbers = new Set();
            const patterns = [/(fixes|closes|resolves)\s+#(\d+)/gi, /#(\d+)/g];
            for (const re of patterns) { let m; while ((m = re.exec(body)) !== null) { const n = parseInt(m[m.length - 1], 10); if (!Number.isNaN(n)) numbers.add(n); } }

            if (numbers.size === 0) {
              if (context.payload.action !== 'closed') {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: '提示：PR 描述未引用 Issue，建议添加 `Fixes #<issue>` 实现自动同步。' }).catch(() => {});
              }
              return;
            }

            for (const issue_number of numbers) {
              if (context.payload.action === 'closed' && pr.merged) {
                // Mark done label (auto-close handled by another workflow or keywords)
                try { await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['status: done'] }); } catch {}
              } else {
                // Mark in-progress on PR open/sync
                try { await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['status: in-progress'] }); } catch {}
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'status: todo' }); } catch {}
              }
            }

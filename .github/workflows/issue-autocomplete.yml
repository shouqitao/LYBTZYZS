name: Issue Autocomplete (Checklist & Plan)

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  enrich-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Generate checklist & plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body  = issue.body  || '';

            // Skip if already has a checklist-like block
            if ((body + '').match(/\[(SRV|CLI|DOC|AUTH|USR|PAT|MC|CON|PRS|HRB|FRM|SHR|CI)\-[0-9]+\]/)) {
              core.info('Checklist appears to exist. Skipping.');
              return;
            }

            // Infer involved modules from title/body keywords (very lightweight)
            const mods = [];
            const text = (title + '\n' + body).toLowerCase();
            function add(m){ if(!mods.includes(m)) mods.push(m); }
            if (/webapi|api|server|program\.cs/.test(text)) add('Server(WebAPI)');
            if (/wpf|desktop|prism|client/.test(text)) add('Client(Desktop)');
            if (/doc|readme|swagger|index\.md/.test(text)) add('Docs');
            if (mods.length === 0) add('Server(WebAPI)');

            // Minimal module checklist scaffold
            const idOf = (m) => ({
              'Server(WebAPI)': 'SRV',
              'Client(Desktop)': 'CLI',
              'Docs': 'DOC'
            }[m] || 'SRV');

            const items = mods.map((m, i) => `- [ ] [${idOf(m)}-${i+1}] 待细化条目（请补充：产出物路径 + 验收点）`).join('\n');

            const comment = [
              '> 自动补全：根据 CLAUDE.md 规范生成的占位清单与计划\n',
              '### 模块化功能清单（占位）\n',
              items + '\n',
              '### 实施计划（占位）\n',
              '1) 明确目标/范围/AC（引用模板字段）\n',
              '2) 小步提交，PR 引用编号（如 [SRV-1]）\n',
              '3) 编译守门：dotnet build 通过\n',
              '4) 证据回填：日志/截图/链接\n'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });


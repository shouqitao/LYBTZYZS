name: 🧪 P3-测试逻辑优化与覆盖率提升

on:
  push:
    branches: [ master, main, develop, 'feature/test-*' ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:
    inputs:
      coverage_threshold:
        description: '覆盖率阈值百分比'
        required: false
        default: '70'

env:
  # P3任务覆盖率目标
  COVERAGE_THRESHOLD_LINE: ${{ github.event.inputs.coverage_threshold || '70' }}
  COVERAGE_THRESHOLD_BRANCH: ${{ github.event.inputs.coverage_threshold || '70' }}  
  COVERAGE_THRESHOLD_METHOD: ${{ github.event.inputs.coverage_threshold || '70' }}
  DOTNET_VERSION: '8.0.x'

jobs:
  test-and-coverage:
    name: 🧪 测试与覆盖率收集
    runs-on: windows-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史，用于覆盖率对比
        
    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 📦 还原依赖
      run: dotnet restore LYBT.All.sln

    - name: 🔨 构建项目
      run: dotnet build LYBT.All.sln --configuration Release --no-restore
      
    - name: 🧪 运行测试 (关键模块)
      run: |
        echo "🎯 运行关键模块测试: Users, Patients, Prescriptions, Consultation, Herbs, Formula"
        
        # 运行用户模块测试
        echo "👤 运行Users模块测试..."
        dotnet test tests/**/Users.UnitTests/*.csproj \
          --configuration Release \
          --no-build \
          --settings .runsettings \
          --collect:"XPlat Code Coverage" \
          --logger "trx;LogFileName=users-test-results.trx" \
          --logger "console;verbosity=detailed" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura || true
    
    - name: 🔧 安装 ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool
      
    - name: 📊 生成覆盖率报告
      run: |
        echo "📈 合并覆盖率数据并生成报告..."
        
        # 查找所有覆盖率文件
        coverage_files=$(find BIN/TestResults -name "coverage.cobertura.xml" | paste -sd ";" -)
        
        if [ -n "$coverage_files" ]; then
          echo "找到覆盖率文件: $coverage_files"
          
          # 生成HTML报告和徽章
          reportgenerator \
            "-reports:$coverage_files" \
            "-targetdir:BIN/TestResults/CoverageReport" \
            "-reporttypes:Html;JsonSummary;Badges;TextSummary" \
            "-sourcedirs:src" \
            "-title:LYBTZYZS P3-测试覆盖率报告" \
            "-tag:${{ github.sha }}" \
            "-assemblyfilters:-*Tests*;-*TestUtilities*" \
            "-classfilters:-*Tests*;-*Mock*;-*Stub*"
          
          echo "✅ 覆盖率报告生成完成"
        else
          echo "⚠️ 未找到覆盖率数据文件"
          exit 1
        fi
    
    - name: 🎯 检查覆盖率阈值
      run: |
        echo "🎯 P3任务覆盖率阈值检查: Line≥${{ env.COVERAGE_THRESHOLD_LINE }}%"
        
        summary_file="TestResults/CoverageReport/Summary.json"
        
        if [ -f "$summary_file" ]; then
          # 提取覆盖率数据
          line_coverage=$(cat "$summary_file" | jq -r '.coverage.linecoverage')
          
          echo "📊 当前覆盖率:"
          echo "  - 行覆盖率 (Line): ${line_coverage}%"
          
          # 检查阈值
          if (( $(echo "$line_coverage < ${{ env.COVERAGE_THRESHOLD_LINE }}" | bc -l) )); then
            echo "❌ 行覆盖率 ($line_coverage%) 低于阈值 (${{ env.COVERAGE_THRESHOLD_LINE }}%)"
            exit 1
          else
            echo "✅ 行覆盖率达标 ($line_coverage% ≥ ${{ env.COVERAGE_THRESHOLD_LINE }}%)"
          fi
        else
          echo "❌ 未找到覆盖率摘要文件"
          exit 1
        fi
    
    - name: 📤 上传覆盖率报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ github.run_number }}
        path: BIN/TestResults/CoverageReport/
        retention-days: 30

name: 测试覆盖率报告

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test-coverage:
    name: 测试和覆盖率
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      
    - name: 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 安装报告工具
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.2.0
        dotnet tool install -g coverlet.console --version 6.0.0
        
    - name: 还原依赖包
      run: dotnet restore LYBT.All.sln
      
    - name: 构建解决方案
      run: dotnet build LYBT.All.sln --configuration Release --no-restore
      
    - name: 运行测试并收集覆盖率
      run: |
        $testProjects = @(
          "tests/Backend/LYBT.Module.Users.Tests/LYBT.Module.Users.Tests.csproj",
          "tests/Backend/LYBT.Module.Patients.Tests/LYBT.Module.Patients.Tests.csproj", 
          "tests/Backend/LYBT.Module.Herbs.Tests/LYBT.Module.Herbs.Tests.csproj"
        )
        
        $coverageFiles = @()
        
        foreach ($project in $testProjects) {
          $projectName = [System.IO.Path]::GetFileNameWithoutExtension($project)
          Write-Host "Testing $projectName..."
          
          dotnet test $project `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=$projectName.trx" `
            --logger "GitHubActions" `
            --collect:"XPlat Code Coverage" `
            --results-directory "./TestResults/$projectName" `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat="cobertura" `
            /p:CoverletOutput="./TestResults/Coverage/$projectName.cobertura.xml"
            
          $coverageFile = "./TestResults/Coverage/$projectName.cobertura.xml"
          if (Test-Path $coverageFile) {
            $coverageFiles += $coverageFile
          }
        }
        
        # 保存覆盖率文件列表供后续步骤使用
        $coverageFiles -join ";" | Out-File -FilePath coverage-files.txt
      
    - name: 生成覆盖率报告
      run: |
        $coverageFiles = Get-Content coverage-files.txt
        
        reportgenerator `
          "-reports:$coverageFiles" `
          "-targetdir:./TestResults/CoverageReport" `
          "-reporttypes:Html;Badges;Cobertura;MarkdownSummary" `
          "-title:LYBTZYZS Coverage Report" `
          "-verbosity:Info"
          
    - name: 生成覆盖率摘要
      run: |
        # 读取Markdown摘要
        $summaryFile = "./TestResults/CoverageReport/Summary.md"
        if (Test-Path $summaryFile) {
          $summary = Get-Content $summaryFile -Raw
          
          # 添加到GitHub步骤摘要
          @"
        ## 📊 测试覆盖率报告
        
        $summary
        
        ### 📈 详细信息
        - 完整HTML报告已作为工件上传
        - 查看 Actions 工件获取详细覆盖率报告
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        }
        
    - name: 上传测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          ./TestResults/**/*.trx
          ./TestResults/**/*.html
        retention-days: 30
        
    - name: 上传覆盖率报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: ./TestResults/CoverageReport/
        retention-days: 30
        
    - name: 覆盖率质量门控
      run: |
        # 读取覆盖率数据
        $coberturaFile = Get-ChildItem -Path "./TestResults/Coverage" -Filter "*.cobertura.xml" | Select-Object -First 1
        
        if ($coberturaFile) {
          [xml]$coverage = Get-Content $coberturaFile.FullName
          $lineRate = [double]$coverage.coverage.'line-rate' * 100
          $branchRate = [double]$coverage.coverage.'branch-rate' * 100
          
          Write-Host "Line Coverage: $lineRate%"
          Write-Host "Branch Coverage: $branchRate%"
          
          # 设置最低覆盖率要求
          $minLineCoverage = 60
          $minBranchCoverage = 50
          
          if ($lineRate -lt $minLineCoverage) {
            Write-Error "❌ 行覆盖率 ($lineRate%) 低于要求 ($minLineCoverage%)"
            exit 1
          }
          
          if ($branchRate -lt $minBranchCoverage) {
            Write-Error "❌ 分支覆盖率 ($branchRate%) 低于要求 ($minBranchCoverage%)"
            exit 1
          }
          
          Write-Host "✅ 覆盖率符合要求"
        }
        
    - name: 发布覆盖率到PR评论
      uses: 5monkeys/cobertura-action@master
      if: github.event_name == 'pull_request'
      with:
        path: './TestResults/Coverage/*.cobertura.xml'
        minimum_coverage: 60
        fail_below_threshold: true
        show_line: true
        show_branch: true
        show_missing: true
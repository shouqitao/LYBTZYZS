name: WPF 完整编译检查

on:
  # 仅手动触发，避免与快速CI重复
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-windows:
    name: Windows 完整编译
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原完整解决方案依赖
        run: |
          dotnet restore LYBTZYZS.sln --verbosity minimal

      - name: 编译 Desktop 客户端
        run: |
          dotnet build LYBTZYZS.sln -c Release --no-restore --verbosity minimal /p:TreatWarningsAsErrors=false /p:WarningLevel=0

      - name: 运行架构测试
        run: |
          dotnet test tests/LYBT.Tests.Architecture/LYBT.Tests.Architecture.csproj -c Release --no-build --logger "console;verbosity=normal" /p:TreatWarningsAsErrors=false

      - name: 编译结果报告
        if: always()
        run: |
          if ($? -eq 0) {
            Write-Output "✅ Windows 完整编译成功" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Output "❌ Windows 完整编译失败" >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }

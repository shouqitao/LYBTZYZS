# 安全扫描流程 - Issue #933 CI 重构
# 合并自: security-scan.yml (移除 Docker/K8s 违规部分)
# 移除项: 容器镜像扫描, Kubernetes/Docker Compose 基础设施扫描
name: CI - Security Scanning

on:
  schedule:
    # 每天凌晨2点运行
    - cron: '0 2 * * *'
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - '.github/workflows/ci-security.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ==================== 代码安全扫描 ====================
  code-security:
    name: 代码安全扫描
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # 获取完整历史用于 GitLeaks

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔍 GitLeaks 敏感信息扫描
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  # ==================== 依赖漏洞扫描 ====================
  dependency-scan:
    name: 依赖漏洞扫描
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 NuGet 包漏洞扫描
      shell: bash
      run: |
        echo "扫描易受攻击的 NuGet 包..."

        # 列出所有易受攻击的包
        dotnet list package --vulnerable --include-transitive

        # 生成 JSON 报告
        dotnet list package --vulnerable --include-transitive --format json > vulnerable-packages.json || true

        # 检查是否有高危漏洞
        if [ -s vulnerable-packages.json ]; then
          echo "⚠️ 发现易受攻击的依赖包"
          cat vulnerable-packages.json
        else
          echo "✅ 未发现易受攻击的依赖包"
        fi

    - name: 🔍 OWASP 依赖检查
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'LYBTZYZS'
        path: '.'
        format: 'ALL'
        args: >
          --enableRetired
          --enableExperimental
      continue-on-error: true

    - name: 📊 上传依赖检查报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-reports-${{ github.run_id }}
        path: reports/
        retention-days: 30

  # ==================== SAST 静态应用安全测试 ====================
  sast-scan:
    name: SAST 静态安全测试
    runs-on: ubuntu-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔍 Semgrep 扫描
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/csharp
          p/owasp-top-ten
          p/r2c-security-audit
      continue-on-error: true

    - name: 🔒 CodeQL 分析
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        queries: security-and-quality

    - name: 🔨 构建项目（CodeQL 需要）
      run: |
        dotnet restore LYBT.All.sln
        dotnet build LYBT.All.sln --configuration Release --no-restore

    - name: 📊 执行 CodeQL 分析
      uses: github/codeql-action/analyze@v3

  # ==================== 许可证合规性检查 ====================
  license-check:
    name: 许可证合规性检查
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📜 .NET 项目许可证检查
      shell: bash
      run: |
        echo "检查 .NET 项目许可证..."

        dotnet tool install -g dotnet-project-licenses
        dotnet-project-licenses -i LYBT.All.sln -o
      continue-on-error: true

    - name: 📊 上传许可证报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: license-reports-${{ github.run_id }}
        path: |
          licenses.json
          licenses.txt
        retention-days: 30

  # ==================== 安全报告汇总 ====================
  security-report:
    name: 安全报告汇总
    runs-on: windows-latest
    needs: [code-security, dependency-scan, sast-scan, license-check]
    if: always()

    steps:
    - name: 📊 生成汇总报告
      shell: bash
      run: |
        echo "# 🔒 安全扫描报告" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**扫描时间**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "## 📋 扫描结果汇总" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 扫描项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| 代码安全扫描 | ${{ needs.code-security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 依赖漏洞扫描 | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| SAST扫描 | ${{ needs.sast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 许可证检查 | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # 判断整体状态
        if [[ "${{ needs.code-security.result }}" == "failure" ]] || \
           [[ "${{ needs.dependency-scan.result }}" == "failure" ]]; then
          echo "⚠️ **发现安全问题，请立即处理！**" >> $GITHUB_STEP_SUMMARY
          echo "security_status=critical" >> $GITHUB_ENV
        else
          echo "✅ **未发现严重安全问题**" >> $GITHUB_STEP_SUMMARY
          echo "security_status=ok" >> $GITHUB_ENV
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**提交信息**:" >> $GITHUB_STEP_SUMMARY
        echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- 分支: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- 提交者: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

    - name: 🚫 创建 Issue（如果发现严重问题）
      if: env.security_status == 'critical'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🔒 安全扫描发现严重问题',
            body: `安全扫描在提交 ${context.sha} 中发现了潜在的安全问题。

          **扫描结果详情**:
          - 代码安全: ${{ needs.code-security.result }}
          - 依赖漏洞: ${{ needs.dependency-scan.result }}
          - SAST扫描: ${{ needs.sast-scan.result }}
          - 许可证检查: ${{ needs.license-check.result }}

          请查看 [扫描详细日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

          **处理指导**:
          1. 优先修复高危漏洞
          2. 更新易受攻击的依赖包
          3. 修复代码安全问题
          4. 确保许可证合规性

          请尽快处理这些安全问题。`,
            labels: ['security', 'high-priority', 'status: todo']
          })

  # ==================== 安全扫描成功总结 ====================
  security-success:
    name: ✅ 安全扫描通过
    runs-on: windows-latest
    needs: [code-security, dependency-scan, sast-scan, license-check]
    if: success()

    steps:
    - name: 安全扫描通过
      shell: bash
      run: |
        echo "## ✅ 安全扫描验证通过" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "所有安全检查已通过：" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 代码安全扫描（GitLeaks + Security Code Scan）" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 依赖漏洞扫描（NuGet + OWASP）" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SAST 静态安全测试（Semgrep + CodeQL）" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 许可证合规性检查" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**项目符合安全标准，未发现严重安全漏洞。**" >> $GITHUB_STEP_SUMMARY

  security-failed:
    name: ❌ 安全扫描失败
    runs-on: windows-latest
    needs: [code-security, dependency-scan, sast-scan, license-check]
    if: failure()

    steps:
    - name: 安全扫描失败
      shell: bash
      run: |
        echo "## ❌ 安全扫描验证失败" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**发现安全问题** - 必须修复所有安全漏洞" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**失败状态**:" >> $GITHUB_STEP_SUMMARY
        echo "- 代码安全: ${{ needs.code-security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 依赖漏洞: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- SAST扫描: ${{ needs.sast-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 许可证检查: ${{ needs.license-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**修复指导**:" >> $GITHUB_STEP_SUMMARY
        echo "1. 检查 GitLeaks 扫描结果，移除敏感信息" >> $GITHUB_STEP_SUMMARY
        echo "2. 更新易受攻击的 NuGet 包" >> $GITHUB_STEP_SUMMARY
        echo "3. 修复 SAST 扫描发现的代码安全问题" >> $GITHUB_STEP_SUMMARY
        echo "4. 确保所有依赖包许可证合规" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "详细错误信息请查看上方构建日志" >> $GITHUB_STEP_SUMMARY
        exit 1

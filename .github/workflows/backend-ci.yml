name: 后端持续集成 (Backend CI)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/Server/**'
      - 'src/Shared/**'
      - 'tests/UnitTests/Modules/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/Server/**'
      - 'src/Shared/**'
      - 'tests/UnitTests/Modules/**'
      - '.github/workflows/backend-ci.yml'

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: 构建和测试后端
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      
    - name: 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 缓存 NuGet 包
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: 还原依赖
      run: dotnet restore LYBT.Server.sln
      
    - name: 构建后端
      run: dotnet build LYBT.Server.sln --configuration ${{ env.CONFIGURATION }} --no-restore
      
    - name: 运行单元测试
      run: |
        dotnet test tests/UnitTests/Modules/Users.UnitTests/LYBT.Module.Users.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --settings .runsettings --logger "trx;LogFileName=users-tests.trx" --collect:"XPlat Code Coverage" -- xUnit.ParallelizeTestCollections=false

        dotnet test tests/UnitTests/Modules/Patients.UnitTests/LYBT.Module.Patients.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --settings .runsettings --logger "trx;LogFileName=patients-tests.trx" --collect:"XPlat Code Coverage" -- xUnit.ParallelizeTestCollections=false

        dotnet test tests/UnitTests/Modules/Herbs.UnitTests/LYBT.Module.Herbs.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --settings .runsettings --logger "trx;LogFileName=herbs-tests.trx" --collect:"XPlat Code Coverage" -- xUnit.ParallelizeTestCollections=false
          
    - name: 生成测试报告
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: 后端测试报告
        path: 'BIN/TestResults/**/*.trx'
        reporter: dotnet-trx
        
    - name: 上传覆盖率报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: 'BIN/TestResults/**/coverage.cobertura.xml'
        
    - name: 发布 Web API
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        dotnet publish src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj --configuration ${{ env.CONFIGURATION }} --output ./publish/api
          
    - name: 上传发布产物
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: webapi-${{ github.sha }}
        path: ./publish/api
        retention-days: 7
        
  code-quality:
    name: 代码质量检查
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      
    - name: 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 安装代码分析工具
      run: |
        dotnet tool install -g dotnet-format
        dotnet tool install -g dotnet-reportgenerator-globaltool
        
    - name: 检查代码格式
      run: dotnet format LYBT.Server.sln --verify-no-changes --verbosity diagnostic
      continue-on-error: true
      
    - name: 运行代码分析
      run: dotnet build LYBT.Server.sln /p:TreatWarningsAsErrors=true /p:WarningLevel=4

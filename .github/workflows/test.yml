name: 测试套件

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.props'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit-tests:
    name: 单元测试
    runs-on: windows-latest
    
    strategy:
      matrix:
        test-project: [
          'tests/Backend/LYBT.Module.Users.Tests/LYBT.Module.Users.Tests.csproj',
          'tests/Backend/LYBT.Module.Patients.Tests/LYBT.Module.Patients.Tests.csproj',
          'tests/Backend/LYBT.Module.Herbs.Tests/LYBT.Module.Herbs.Tests.csproj',
          'tests/Backend/LYBT.Module.Consultation.Tests/LYBT.Module.Consultation.Tests.csproj',
          'tests/Backend/LYBT.WebAPI.Tests/LYBT.WebAPI.Tests.csproj',
          'tests/Frontend/LYBT.WPF.Client.Tests/LYBT.WPF.Client.Tests.csproj'
        ]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5

    - name: 设置 .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 还原依赖包
      run: dotnet restore ${{ matrix.test-project }}

    - name: 构建测试项目
      run: dotnet build ${{ matrix.test-project }} --configuration Release --no-restore

    - name: 运行测试
      run: |
        $projectName = [System.IO.Path]::GetFileNameWithoutExtension("${{ matrix.test-project }}")
        dotnet test ${{ matrix.test-project }} `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --logger "trx;LogFileName=$projectName.trx" `
          --logger "html;LogFileName=$projectName.html" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults/$projectName

    - name: 上传测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ strategy.job-index }}
        path: ./TestResults
        retention-days: 7

  integration-tests:
    name: 集成测试
    runs-on: windows-latest
    needs: unit-tests
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5

    - name: 设置 .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装 Python 依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest pytest-html

    - name: 还原依赖包
      run: dotnet restore LYBT.All.sln

    - name: 构建解决方案
      run: dotnet build LYBT.All.sln --configuration Release --no-restore

    - name: 启动 API 服务
      run: |
        Start-Process -FilePath "dotnet" -ArgumentList "run", "--project", "src/Backend/Services/LYBT.WebAPI/LYBT.WebAPI.csproj", "--configuration", "Release", "--no-build"
        Start-Sleep -Seconds 30

    - name: 运行 .NET 集成测试
      run: |
        dotnet test tests/Integration/LYBT.IntegrationTests/LYBT.IntegrationTests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --logger "trx;LogFileName=integration-tests.trx" `
          --results-directory ./TestResults/Integration

    - name: 运行 Python API 测试
      run: |
        cd tests/Integration
        python consultation_flow_test.py
      continue-on-error: true

    - name: 上传集成测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: ./TestResults/Integration
        retention-days: 7

  test-summary:
    name: 测试汇总
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    
    steps:
    - name: 下载所有测试结果
      uses: actions/download-artifact@v4
      with:
        pattern: '*test-results*'
        merge-multiple: true

    - name: 生成测试汇总报告
      run: |
        echo "# 测试执行报告" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 测试状态" >> $GITHUB_STEP_SUMMARY
        echo "- 单元测试: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 集成测试: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 测试详情" >> $GITHUB_STEP_SUMMARY
        echo "请查看工件中的详细测试报告" >> $GITHUB_STEP_SUMMARY
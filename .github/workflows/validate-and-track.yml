name: Validate and Track

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [closed]

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check PR references feature IDs
        shell: bash
        run: |
          msg=$(jq -r '.pull_request.title + "\n" + .pull_request.body' < $GITHUB_EVENT_PATH)
          echo "$msg" | grep -E '\[(SRV|CLI|DOC|AUTH|USR|PAT|MC|CON|PRS|HRB|FRM|SHR|CI)\-[0-9]+\]' || {
            echo 'ERROR: PR 未引用功能清单编号（如 [SRV-1]）' ; exit 1 ; }

  track:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Extract referenced feature IDs
        id: extract
        shell: bash
        run: |
          echo "ids=$(echo \"${{ github.event.pull_request.title }}
          ${{ github.event.pull_request.body }}\" | grep -Eo '\\[(SRV|CLI|DOC|AUTH|USR|PAT|MC|CON|PRS|HRB|FRM|SHR|CI)\\-[0-9]+\\]' | tr -d '[]' | tr '\n' ' ' )" >> $GITHUB_OUTPUT
      - name: Comment merged PR (placeholder)
        if: ${{ github.event.pull_request.merged }}
        uses: actions/github-script@v7
        with:
          script: |
            const ids = `"${{ steps.extract.outputs.ids }}"`.trim();
            if (!ids) return;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `已合并。引用功能清单：${ids}。请到对应 Issue 勾选条目（后续可接入自动勾选）。`
            });


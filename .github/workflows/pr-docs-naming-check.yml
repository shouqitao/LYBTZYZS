name: PR Checks - Docs-only naming checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  docs_naming_check:
    name: Verify docs-only naming checklist
    runs-on: windows-latest
    steps:
      - name: Inspect PR body and changed files
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request context; skipping.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // List changed files
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const isDocFile = (f) => f.filename.endsWith('.md') && (f.filename.startsWith('docs/') || ['README.md','AGENTS.md','CONTRIBUTING.md'].includes(f.filename));
            const docsChanged = files.some(isDocFile);
            if (!docsChanged) {
              core.info('No Markdown docs changed; skipping docs-only checklist.');
              return;
            }
            const body = (pr.body || '').toString();
            // Docs-only naming checklist items
            const namingChecked = /-\s*\[(x|X)\]\s*文档中品牌表述统一/.test(body);
            const codeIdsUntouchedChecked = /-\s*\[(x|X)\]\s*未改动代码标识/.test(body);
            if (namingChecked && codeIdsUntouchedChecked) {
              core.info('Docs-only naming checks passed.');
            } else {
              core.warning('Docs-only 名词约定检查未勾选完整：请在 PR 模板中勾选“文档中品牌表述统一”与“未改动代码标识/命名空间/路径（保持 LYBT.*）”。');
            }
            // Unified constraints checklist (advisory)
            const routeChecked = /-\s*\[(x|X)\].*路由统一小写/.test(body);
            const jsonChecked  = /-\s*\[(x|X)\].*JSON\s*统一\s*System\.Text\.Json/.test(body);
            const binChecked   = /-\s*\[(x|X)\].*构建与测试产物.*BIN\//.test(body);
            if (!(routeChecked && jsonChecked && binChecked)) {
              core.warning('统一约束检查未全部勾选（路由/JSON/BIN）。请核对 PR 模板“统一约束校验”一节。');
            }
            // Always succeed (advisory). Branch protection can still require this workflow if desired.
            core.info('Advisory checks completed.');

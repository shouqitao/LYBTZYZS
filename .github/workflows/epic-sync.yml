name: Epic Status Sync

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]
  pull_request:
    types: [closed]
  schedule:
    # 每6小时自动同步一次所有Epic状态
    - cron: '0 */6 * * *'

jobs:
  sync-epic-from-task:
    name: 同步Epic状态 (Task触发)
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'epic:')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'epic:'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Extract Epic Label
        id: extract_epic
        run: |
          if [ "${{ github.event_name }}" == "issues" ]; then
            epic_label=$(echo '${{ toJSON(github.event.issue.labels) }}' | jq -r '.[] | select(.name | startswith("epic:")) | .name')
          else
            epic_label=$(echo '${{ toJSON(github.event.pull_request.labels) }}' | jq -r '.[] | select(.name | startswith("epic:")) | .name')
          fi
          
          echo "epic_label=$epic_label" >> $GITHUB_OUTPUT
          echo "检测到Epic标签: $epic_label"
      
      - name: Find Epic Issue
        id: find_epic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          epic_number=$(gh issue list \
            --label "${{ steps.extract_epic.outputs.epic_label }}" \
            --label "type:epic" \
            --json number \
            -q '.[0].number')
          
          if [ -z "$epic_number" ]; then
            echo "未找到对应的Epic Issue"
            exit 0
          fi
          
          echo "epic_number=$epic_number" >> $GITHUB_OUTPUT
          echo "找到Epic Issue: #$epic_number"
      
      - name: Sync Epic Status
        if: steps.find_epic.outputs.epic_number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          epic_number="${{ steps.find_epic.outputs.epic_number }}"
          epic_label="${{ steps.extract_epic.outputs.epic_label }}"
          
          # 获取所有关联的Task Issues
          tasks=$(gh issue list \
            --label "$epic_label" \
            --json number,title,state,labels \
            --jq .)
          
          # 统计Task状态
          total_tasks=$(echo "$tasks" | jq 'length')
          
          if [ "$total_tasks" -eq 0 ]; then
            echo "Epic #$epic_number 下没有关联的Task"
            exit 0
          fi
          
          closed_tasks=$(echo "$tasks" | jq '[.[] | select(.state=="CLOSED")] | length')
          open_tasks=$(echo "$tasks" | jq '[.[] | select(.state=="OPEN")] | length')
          in_progress_tasks=$(echo "$tasks" | jq '[.[] | select(.labels[].name=="status: in-progress")] | length')
          blocked_tasks=$(echo "$tasks" | jq '[.[] | select(.labels[].name=="status: blocked")] | length')
          
          # 计算进度
          if [ "$total_tasks" -gt 0 ]; then
            progress=$((closed_tasks * 100 / total_tasks))
          else
            progress=0
          fi
          
          echo "Epic #$epic_number 进度统计:"
          echo "  总Task数: $total_tasks"
          echo "  已完成: $closed_tasks"
          echo "  进行中: $in_progress_tasks"
          echo "  阻塞: $blocked_tasks"
          echo "  完成率: $progress%"
          
          # 生成进度报告
          progress_report=$(cat <<EOF
          ## 📊 Epic进度报告
          **更新时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **触发事件**: ${{ github.event_name }}
          
          ### 整体进度
          - **完成率**: $progress% ($closed_tasks/$total_tasks)
          - **进行中**: $in_progress_tasks 个Task
          - **阻塞**: $blocked_tasks 个Task
          
          ### Task状态分布
          | 状态 | 数量 | 占比 |
          |------|------|------|
          | ✅ 已完成 | $closed_tasks | $((closed_tasks * 100 / total_tasks))% |
          | 🔄 进行中 | $in_progress_tasks | $((in_progress_tasks * 100 / total_tasks))% |
          | ⏸️ 待开始 | $((open_tasks - in_progress_tasks)) | $(((open_tasks - in_progress_tasks) * 100 / total_tasks))% |
          | 🚫 阻塞 | $blocked_tasks | $((blocked_tasks * 100 / total_tasks))% |
          
          ### 详细Task列表
          $(echo "$tasks" | jq -r '.[] | "- [\(if .state=="CLOSED" then "x" else " " end)] #\(.number) \(.title) \(if (.labels[].name=="status: in-progress") then "🔄" elif (.labels[].name=="status: blocked") then "🚫" else "" end)"')
          
          ---
          *本报告由Epic状态同步工作流自动生成*
          EOF
          )
          
          # 添加进度报告到Epic Issue
          gh issue comment "$epic_number" --body "$progress_report"
          
          # 更新Epic状态标签
          if [ "$progress" -eq 100 ]; then
            # 所有Task完成 → 关闭Epic
            gh issue edit "$epic_number" --add-label "status: done"
            gh issue close "$epic_number" --comment "✅ 所有Task已完成，Epic自动关闭"
            echo "✅ Epic #$epic_number 所有Task已完成，已自动关闭"
            
          elif [ "$in_progress_tasks" -gt 0 ]; then
            # 有Task正在进行 → 标记Epic为in-progress
            gh issue edit "$epic_number" --remove-label "status: todo" --add-label "status: in-progress" || true
            echo "🔄 Epic #$epic_number 状态已更新为 in-progress"
            
          elif [ "$blocked_tasks" -gt 0 ]; then
            # 有阻塞Task → 标记Epic为blocked
            gh issue edit "$epic_number" --add-label "status: blocked"
            gh issue comment "$epic_number" --body "⚠️ **Epic阻塞警告**\n存在 $blocked_tasks 个阻塞Task，请及时处理"
            echo "🚫 Epic #$epic_number 存在阻塞Task"
          fi

  sync-all-epics:
    name: 定时同步所有Epic
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Sync All Open Epics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有open的Epic Issues
          epic_list=$(gh issue list \
            --label "type:epic" \
            --state open \
            --json number,labels \
            --jq '.[] | "\(.number)|\(.labels[] | select(.name | startswith("epic:")) | .name)"')
          
          if [ -z "$epic_list" ]; then
            echo "没有需要同步的Epic"
            exit 0
          fi
          
          echo "开始同步所有Epic..."
          
          while IFS='|' read -r epic_number epic_label; do
            echo ""
            echo "========================================="
            echo "同步 Epic #$epic_number ($epic_label)"
            echo "========================================="
            
            # 获取关联的Task Issues
            tasks=$(gh issue list \
              --label "$epic_label" \
              --json number,title,state,labels \
              --jq .)
            
            total_tasks=$(echo "$tasks" | jq 'length')
            
            if [ "$total_tasks" -eq 0 ]; then
              echo "Epic #$epic_number 下没有关联的Task，跳过"
              continue
            fi
            
            closed_tasks=$(echo "$tasks" | jq '[.[] | select(.state=="CLOSED")] | length')
            open_tasks=$(echo "$tasks" | jq '[.[] | select(.state=="OPEN")] | length')
            in_progress_tasks=$(echo "$tasks" | jq '[.[] | select(.labels[].name=="status: in-progress")] | length')
            blocked_tasks=$(echo "$tasks" | jq '[.[] | select(.labels[].name=="status: blocked")] | length')
            
            progress=$((closed_tasks * 100 / total_tasks))
            
            echo "进度: $progress% ($closed_tasks/$total_tasks)"
            echo "进行中: $in_progress_tasks, 阻塞: $blocked_tasks"
            
            # 生成简要进度报告
            summary_report=$(cat <<EOF
            ## 📊 定时同步进度报告
            **同步时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            
            **进度**: $progress% ($closed_tasks/$total_tasks)
            - ✅ 已完成: $closed_tasks
            - 🔄 进行中: $in_progress_tasks
            - ⏸️ 待开始: $((open_tasks - in_progress_tasks))
            - 🚫 阻塞: $blocked_tasks
            
            ---
            *定时同步 (每6小时)*
            EOF
            )
            
            # 添加进度报告
            gh issue comment "$epic_number" --body "$summary_report"
            
            # 更新状态标签
            if [ "$progress" -eq 100 ]; then
              gh issue edit "$epic_number" --add-label "status: done"
              gh issue close "$epic_number" --comment "✅ 所有Task已完成，Epic自动关闭"
              echo "✅ Epic #$epic_number 已完成并关闭"
            elif [ "$in_progress_tasks" -gt 0 ]; then
              gh issue edit "$epic_number" --remove-label "status: todo" --add-label "status: in-progress" || true
              echo "🔄 Epic #$epic_number 更新为 in-progress"
            elif [ "$blocked_tasks" -gt 0 ]; then
              gh issue edit "$epic_number" --add-label "status: blocked"
              echo "🚫 Epic #$epic_number 存在阻塞Task"
            fi
            
          done <<< "$epic_list"
          
          echo ""
          echo "========================================="
          echo "所有Epic同步完成"
          echo "========================================="

  notify-sla-violation:
    name: SLA违规检测
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Check SLA Violations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_time=$(date -u +%s)
          
          # P0: 24小时, P1: 3天, P2: 7天
          p0_sla=86400
          p1_sla=259200
          p2_sla=604800
          
          # 检查P0超期（使用date命令解析时间，避免jq的fromdateiso8601依赖）
          p0_issues=$(gh issue list \
            --label "priority:p0" \
            --state open \
            --json number,title,createdAt \
            --jq .)
          p0_violations=$(echo "$p0_issues" | jq -r '.[] | "\(.number)|\(.title)|\(.createdAt)"' | \
            while IFS='|' read -r number title created_at; do
              created_sec=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
              if [ $((current_time - created_sec)) -gt $p0_sla ]; then
                echo "#$number: $title"
              fi
            done)

          # 检查P1超期
          p1_issues=$(gh issue list \
            --label "priority:p1" \
            --state open \
            --json number,title,createdAt \
            --jq .)
          p1_violations=$(echo "$p1_issues" | jq -r '.[] | "\(.number)|\(.title)|\(.createdAt)"' | \
            while IFS='|' read -r number title created_at; do
              created_sec=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
              if [ $((current_time - created_sec)) -gt $p1_sla ]; then
                echo "#$number: $title"
              fi
            done)

          # 检查P2超期
          p2_issues=$(gh issue list \
            --label "priority:p2" \
            --state open \
            --json number,title,createdAt \
            --jq .)
          p2_violations=$(echo "$p2_issues" | jq -r '.[] | "\(.number)|\(.title)|\(.createdAt)"' | \
            while IFS='|' read -r number title created_at; do
              created_sec=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
              if [ $((current_time - created_sec)) -gt $p2_sla ]; then
                echo "#$number: $title"
              fi
            done)
          
          # 生成SLA违规报告
          if [ -n "$p0_violations" ] || [ -n "$p1_violations" ] || [ -n "$p2_violations" ]; then
            echo "⏰ 检测到SLA违规Issue"
            
            violation_report="## ⏰ SLA违规报告\n**检测时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n"
            
            if [ -n "$p0_violations" ]; then
              violation_report+="### P0 (24小时) 超期\n$p0_violations\n\n"
            fi
            
            if [ -n "$p1_violations" ]; then
              violation_report+="### P1 (3天) 超期\n$p1_violations\n\n"
            fi
            
            if [ -n "$p2_violations" ]; then
              violation_report+="### P2 (1周) 超期\n$p2_violations\n\n"
            fi
            
            echo -e "$violation_report"
            
            # TODO: 发送通知到Slack/企业微信/邮件等
          else
            echo "✅ 无SLA违规Issue"
          fi

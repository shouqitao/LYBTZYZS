# WPF 前端 CI 流程 - Issue #933 CI 重构
# 优化自: ci-frontend.yml (修正路径，简化流程)
name: CI - Frontend (WPF)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/Client/Desktop/**'
      - 'tests/**/Desktop*/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/Client/Desktop/**'
      - 'tests/**/Desktop*/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  # ==================== WPF 代码质量检查 ====================
  wpf-code-quality:
    name: WPF 代码质量检查
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 缓存 NuGet 包
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-wpf-

    - name: 🔍 XAML 语法检查
      run: |
        echo "检查 XAML 文件语法..."
        $xamlFiles = Get-ChildItem -Path src/Client/Desktop -Include *.xaml -Recurse
        $errors = 0

        foreach ($file in $xamlFiles) {
          try {
            [xml]$xaml = Get-Content $file.FullName -ErrorAction Stop
            Write-Host "✅ $($file.Name)"
          } catch {
            Write-Error "❌ XAML 语法错误: $($file.FullName) - $_"
            $errors++
          }
        }

        if ($errors -gt 0) {
          Write-Error "发现 $errors 个 XAML 语法错误"
          exit 1
        } else {
          Write-Host "✅ 所有 XAML 文件语法正确"
        }

    - name: 🎨 代码格式验证
      run: |
        dotnet tool install -g dotnet-format
        dotnet format LYBT.Desktop.sln --verify-no-changes --verbosity minimal

  # ==================== WPF 构建与测试 ====================
  wpf-build-test:
    name: WPF 构建与测试
    runs-on: windows-latest
    needs: wpf-code-quality

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 缓存 NuGet 包
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-wpf-

    - name: 📚 恢复依赖包
      run: dotnet restore LYBT.Desktop.sln

    - name: 🔨 构建 WPF 应用
      run: dotnet build LYBT.Desktop.sln --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

    - name: 🧪 运行 WPF 单元测试
      shell: bash
      run: |
        echo "运行 WPF 单元测试..."

        if [ -f "tests/LYBT.Desktop.Tests/LYBT.Desktop.Tests.csproj" ]; then
          dotnet test tests/LYBT.Desktop.Tests/LYBT.Desktop.Tests.csproj \
            --configuration ${{ env.CONFIGURATION }} --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=wpf-test-results.trx" \
            --settings .runsettings \
            -- xUnit.ParallelizeTestCollections=false
        else
          echo "⚠️ WPF 单元测试项目不存在，跳过"
        fi

    - name: 📤 上传测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wpf-test-results-${{ github.run_id }}
        path: |
          BIN/TestResults/**/*.trx
        retention-days: 7

  # ==================== WPF 发布构建（仅主分支）====================
  wpf-publish:
    name: WPF 发布构建
    runs-on: windows-latest
    needs: wpf-build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📚 恢复依赖包
      run: dotnet restore LYBT.Desktop.sln

    - name: 🔨 构建发布版本
      run: dotnet build LYBT.Desktop.sln --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: 📦 发布 WPF 应用
      shell: bash
      run: |
        echo "发布 WPF 应用..."

        if [ -f "src/Client/Desktop/Shell/LYBT.Client.Desktop.Shell.csproj" ]; then
          dotnet publish src/Client/Desktop/Shell/LYBT.Client.Desktop.Shell.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --output ./publish/wpf \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
        else
          echo "⚠️ WPF Shell 项目不存在"
        fi

    - name: 📤 上传发布产物
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wpf-publish-${{ github.run_id }}
        path: ./publish/wpf/
        retention-days: 30

  # ==================== WPF CI 总结 ====================
  wpf-ci-summary:
    name: ✅ WPF CI 完成
    runs-on: windows-latest
    needs: [wpf-code-quality, wpf-build-test]
    if: success()

    steps:
    - name: WPF CI 成功
      shell: bash
      run: |
        echo "## ✅ WPF 前端 CI 验证通过" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "所有检查已通过：" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ XAML 语法检查" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 代码格式验证" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ WPF 应用构建" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ WPF 单元测试" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**提交信息**:" >> $GITHUB_STEP_SUMMARY
        echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- 分支: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- 提交者: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  wpf-ci-failed:
    name: ❌ WPF CI 失败
    runs-on: windows-latest
    needs: [wpf-code-quality, wpf-build-test]
    if: failure()

    steps:
    - name: WPF CI 失败
      shell: bash
      run: |
        echo "## ❌ WPF 前端 CI 验证失败" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**PR被自动阻塞** - 必须修复所有失败项" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**失败状态**:" >> $GITHUB_STEP_SUMMARY
        echo "- WPF 代码质量: ${{ needs.wpf-code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- WPF 构建测试: ${{ needs.wpf-build-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**修复指导**:" >> $GITHUB_STEP_SUMMARY
        echo "1. 检查 XAML 语法错误" >> $GITHUB_STEP_SUMMARY
        echo "2. 运行 \`dotnet format\` 修复格式问题" >> $GITHUB_STEP_SUMMARY
        echo "3. 确保 WPF 应用可以正常构建" >> $GITHUB_STEP_SUMMARY
        echo "4. 修复 WPF 单元测试失败项" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "详细错误信息请查看上方构建日志" >> $GITHUB_STEP_SUMMARY
        exit 1

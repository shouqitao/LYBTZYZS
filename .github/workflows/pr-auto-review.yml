name: PR 自动审查 (Claude Code)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  architecture-tests:
    name: 架构合规测试
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 检查是否有代码变更
        id: check-code
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # 检查是否有.cs/.csproj/.sln文件变更
          if git diff --name-only $BASE_SHA $HEAD_SHA | grep -E '\.(cs|csproj|sln)$'; then
            echo "has_code_change=true" >> $GITHUB_OUTPUT
          else
            echo "has_code_change=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        if: steps.check-code.outputs.has_code_change == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 运行架构测试
        if: steps.check-code.outputs.has_code_change == 'true'
        run: |
          dotnet test tests/Architecture/LYBT.ArchTests.csproj -c Release --logger "console;verbosity=detailed" --filter "FullyQualifiedName~Desktop"

      - name: 报告测试结果
        if: always() && steps.check-code.outputs.has_code_change == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const testPassed = '${{ job.status }}' === 'success';
            const emoji = testPassed ? '✅' : '❌';
            const status = testPassed ? '通过' : '失败';

            const comment = `## ${emoji} 架构合规测试${status}\n\n` +
              `Desktop 层架构测试已执行，详情请查看 [测试日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。\n\n` +
              `测试文件: \`tests/Architecture/DesktopLayerArchTests.cs\`\n` +
              `测试规则: Desktop 四层架构 + 依赖方向验证\n\n` +
              (testPassed ?
                '✅ 所有架构规则验证通过，代码结构符合设计标准。' :
                '❌ 架构测试失败，请检查代码是否违反层间依赖规则。\n\n' +
                '参考文档: [Desktop层架构标准](https://github.com/shouqitao/LYBTZYZS/blob/master/docs/architecture/client/unified-design-standard.md)');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  claude-code-review:
    name: Claude Code 自动审查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 检查文件变更
        id: files
        run: |
          # 使用 GitHub 提供的 base 和 head SHA 进行比较
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only $BASE_SHA $HEAD_SHA >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          FILES_CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA | wc -l)
          LINES_ADDED=$(git diff --numstat $BASE_SHA $HEAD_SHA | awk '{add+=$1} END {print add}')
          LINES_DELETED=$(git diff --numstat $BASE_SHA $HEAD_SHA | awk '{del+=$2} END {print del}')

          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "lines_added=$LINES_ADDED" >> $GITHUB_OUTPUT
          echo "lines_deleted=$LINES_DELETED" >> $GITHUB_OUTPUT

      - name: 自动审查与确认
        uses: actions/github-script@v7
        with:
          script: |
            // 使用 String() 构造函数来避免模板字符串的八进制转义序列问题
            const changedFiles = String.raw`${{ steps.files.outputs.changed_files }}`.trim();
            const filesChanged = '${{ steps.files.outputs.files_changed }}';
            const linesAdded = '${{ steps.files.outputs.lines_added }}';
            const linesDeleted = '${{ steps.files.outputs.lines_deleted }}';

            // 分析变更类型
            const fileList = changedFiles.split('\n').filter(f => f.trim());
            const isDocsOnly = fileList.every(f =>
              f.endsWith('.md') ||
              f.startsWith('.github/') ||
              f.startsWith('docs/') ||
              f.startsWith('scripts/')
            );

            const hasCodeChange = fileList.some(f =>
              f.endsWith('.cs') ||
              f.endsWith('.xaml') ||
              f.endsWith('.csproj') ||
              f.endsWith('.sln')
            );

            let reviewBody = `# 🤖 Claude Code 自动审查报告\n\n`;
            reviewBody += `## 📊 变更统计\n\n`;
            reviewBody += `- **文件数**: ${filesChanged} 个文件\n`;
            reviewBody += `- **新增**: +${linesAdded} 行\n`;
            reviewBody += `- **删除**: -${linesDeleted} 行\n`;
            reviewBody += `- **变更类型**: ${isDocsOnly ? '📄 文档/配置' : '💻 代码变更'}\n\n`;

            reviewBody += `<details>\n<summary>📁 变更文件列表</summary>\n\n\`\`\`\n${changedFiles}\n\`\`\`\n</details>\n\n`;

            reviewBody += `## 📋 审查清单自动确认\n\n`;

            if (isDocsOnly) {
              // 纯文档/配置变更 - 自动确认
              reviewBody += `### ✅ 架构合规性\n`;
              reviewBody += `- ✅ **未引入黑名单技术** - 确认：仅文档/配置变更\n`;
              reviewBody += `- ✅ **符合适度设计原则** - 确认：文档优化\n`;
              reviewBody += `- ✅ **遵守三层架构模式** - 确认：未改动架构\n\n`;

              reviewBody += `### ✅ 代码规范\n`;
              reviewBody += `- ✅ **代码规范** - N/A：无代码变更\n\n`;

              reviewBody += `### ✅ 文档与测试\n`;
              reviewBody += `- ✅ **文档已更新** - 确认：本次为文档变更\n`;
              reviewBody += `- ✅ **测试覆盖** - N/A：无逻辑变更\n\n`;

              reviewBody += `### ✅ 增量原则\n`;
              reviewBody += `- ✅ **最小变更原则** - 确认\n`;
              reviewBody += `- ✅ **无推倒重写** - 确认\n`;
              reviewBody += `- ✅ **向后兼容** - 确认：文档变更不影响代码\n\n`;

              reviewBody += `---\n\n`;
              reviewBody += `## ✅ 自动审查结论\n\n`;
              reviewBody += `**所有审查项已自动通过** - 纯文档/配置变更，无需编译验证\n\n`;
              reviewBody += `💡 **建议**: 可直接合并\n`;
            } else {
              // 有代码变更 - 需要人工确认
              reviewBody += `⚠️ **检测到代码变更，需人工确认以下项：**\n\n`;

              reviewBody += `### 架构合规性\n`;
              reviewBody += `- [ ] 未引入黑名单技术 (Redis/消息队列/微服务/CQRS/Docker/GraphQL)\n`;
              reviewBody += `- [ ] 符合适度设计原则 (KISS, YAGNI)\n`;
              reviewBody += `- [ ] 遵守三层架构模式\n\n`;

              reviewBody += `### 代码规范\n`;
              reviewBody += `- [ ] 类名使用 PascalCase\n`;
              reviewBody += `- [ ] 私有字段使用 \`_camelCase\`\n`;
              reviewBody += `- [ ] 异步方法以 Async 结尾\n`;
              reviewBody += `- [ ] 使用构造函数依赖注入（禁止 ServiceLocator）\n\n`;

              reviewBody += `### 文档与测试\n`;
              reviewBody += `- [ ] 架构变更已更新文档\n`;
              reviewBody += `- [ ] 接口变更已更新文档\n`;
              reviewBody += `- [ ] 核心逻辑已添加单元测试（MVP 阶段可选）\n\n`;

              reviewBody += `### 增量原则\n`;
              reviewBody += `- [ ] 遵循最小变更原则\n`;
              reviewBody += `- [ ] 无推倒重写\n`;
              reviewBody += `- [ ] 保持向后兼容\n\n`;

              reviewBody += `---\n\n`;
              reviewBody += `## ⚠️ 人工审查要求\n\n`;
              reviewBody += `**编译验证**: \`dotnet build LYBT.All.sln -c Release\`\n`;
              reviewBody += `**测试验证**: \`dotnet test LYBT.Server.sln -c Release\`\n\n`;
              reviewBody += `💡 **提示**: 仍需人工最终审批\n`;
            }

            reviewBody += `\n---\n\n`;
            reviewBody += `📚 **参考文档**:\n`;
            reviewBody += `- [技术标准](https://github.com/shouqitao/LYBTZYZS/blob/master/docs/development/standards.md)\n`;
            reviewBody += `- [统一设计标准](https://github.com/shouqitao/LYBTZYZS/blob/master/docs/architecture/client/unified-design-standard.md)\n\n`;
            reviewBody += `🤖 Automated by GitHub Actions`;

            // 创建正式审查（GitHub Actions 无权批准，统一使用 COMMENT）
            const review = await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: reviewBody,
              event: 'COMMENT'
            });

            // 更新 PR 描述，勾选 Claude Code 初审复选框
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let updatedBody = pr.data.body || '';

            // 勾选 Claude Code 初审（包含审查链接）
            // 使用 \s 匹配任何空白字符（包括特殊的 UTF-8 空格）
            const reviewUrl = review.data.html_url;
            updatedBody = updatedBody.replace(
              /-\s*\[\s*\]\s*\*\*Claude Code 初审\*\*[：:][^\n]*/,
              `- [x] **Claude Code 初审**：✅ 已完成 - [查看审查报告](${reviewUrl})`
            );

            // 勾选 GitHub Actions 自动审查
            updatedBody = updatedBody.replace(
              /-\s*\[\s*\]\s*\*\*GitHub Actions 自动审查\*\*[：:][^\n]*/,
              '- [x] **GitHub Actions 自动审查**：✅ 已完成'
            );

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: updatedBody
            });

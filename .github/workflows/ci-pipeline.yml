name: 完整 CI 流水线

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'

jobs:
  # Job 1: 编译后端 API（快速稳定）
  build-backend:
    name: 📦 编译后端 API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原后端依赖
        run: |
          dotnet restore src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj --verbosity minimal

      - name: 编译后端 API
        run: |
          dotnet build src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj -c ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

  # Job 2: 编译前端 WPF Shell（快速稳定）
  build-frontend:
    name: 🖥️ 编译前端 WPF Shell
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原前端依赖（WPF Shell）
        run: |
          dotnet restore src/Client/Desktop/Shell/LYBT.Desktop.Shell.csproj --verbosity minimal

      - name: 编译前端 WPF Shell
        run: |
          dotnet build src/Client/Desktop/Shell/LYBT.Desktop.Shell.csproj -c ${{ env.CONFIGURATION }} --no-restore --verbosity minimal /p:TreatWarningsAsErrors=false /p:WarningLevel=0

  # Job 3: 运行架构测试（快速稳定）
  test-architecture:
    name: 🏗️ 架构合规测试
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 运行架构测试
        run: |
          dotnet test tests/LYBT.Tests.Architecture/LYBT.Tests.Architecture.csproj -c ${{ env.CONFIGURATION }} --logger "console;verbosity=detailed" /p:EnableWindowsTargeting=true /p:TreatWarningsAsErrors=false

  # Job 4: 汇总快速稳定 CI 结果
  report-results:
    name: 📊 汇总测试结果
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-architecture]
    if: always()

    steps:
      - name: 生成测试报告
        run: |
          echo "# 📊 快速稳定 CI 结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 后端编译 | ${{ needs.build-backend.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ WPF Shell 编译 | ${{ needs.build-frontend.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ 架构测试 | ${{ needs.test-architecture.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY

      - name: 在 PR 中发表评论
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const allJobs = {
              backend: '${{ needs.build-backend.result }}',
              frontend: '${{ needs.build-frontend.result }}',
              architecture: '${{ needs.test-architecture.result }}'
            };
            if (!context.issue.number) {
              core.info('No pull request context found, skip comment.');
              return;
            }

            const allPassed = Object.values(allJobs).every(status => status === 'success');
            const emoji = allPassed ? '✅' : '❌';
            const status = allPassed ? '通过' : '失败';

            let comment = `## ${emoji} CI 流水线${status}\n\n`;
            comment += `### 编译状态\n`;
            comment += `- 📦 后端编译: ${allJobs.backend === 'success' ? '✅' : '❌'}\n`;
            comment += `- 🖥️ WPF Shell 编译: ${allJobs.frontend === 'success' ? '✅' : '❌'}\n\n`;
            comment += `### 测试状态\n`;
            comment += `- 🏗️ 架构合规测试: ${allJobs.architecture === 'success' ? '✅' : '❌'}\n\n`;

            if (allPassed) {
              comment += `### ✅ 所有检查通过\n\n`;
              comment += `代码已通过编译和测试，可以合并。`;
            } else {
              comment += `### ❌ 部分检查失败\n\n`;
              comment += `请修复失败的项目后重新提交。\n\n`;
              comment += `**详细日志**: [查看完整日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

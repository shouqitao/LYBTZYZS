name: 快速 CI 流水线

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'

jobs:
  # Job 1: 编译后端 API (Ubuntu - 快速)
  backend-build:
    name: 📦 后端编译
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原后端依赖
        run: |
          dotnet restore src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj --verbosity minimal

      - name: 编译后端 API
        run: |
          dotnet build src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj -c ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

  # Job 2: 编译 WPF Shell (Windows - 快速)
  desktop-build:
    name: 🖥️ 前端编译
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原前端依赖
        shell: pwsh
        run: |
          dotnet restore "src\Client\Desktop\Shell\LYBT.Desktop.Shell.csproj" --verbosity minimal

      - name: 编译 WPF Shell
        shell: pwsh
        run: |
          dotnet build "src\Client\Desktop\Shell\LYBT.Desktop.Shell.csproj" -c ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

  # Job 3: 架构合规测试 (Windows - 需要WPF项目)
  architecture-tests:
    name: 🏗️ 架构测试
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 运行架构测试
        shell: pwsh
        run: |
          dotnet test "tests\LYBT.Tests.Architecture\LYBT.Tests.Architecture.csproj" -c ${{ env.CONFIGURATION }} --logger "console;verbosity=detailed" /p:TreatWarningsAsErrors=false

  # Job 4: 汇总快速 CI 结果
  report-results:
    name: 📊 汇总结果
    runs-on: ubuntu-latest
    needs: [backend-build, desktop-build, architecture-tests]
    if: always()

    steps:
      - name: 生成测试报告
        run: |
          echo "# 📊 快速 CI 测试结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "这是快速CI流水线，仅包含编译和架构测试。完整的测试在夜间CI中运行。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 后端编译 | ${{ needs.backend-build.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ 前端编译 | ${{ needs.desktop-build.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ 架构测试 | ${{ needs.architecture-tests.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY

      - name: 在 PR 中发表评论
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const allJobs = {
              backend: '${{ needs.backend-build.result }}',
              desktop: '${{ needs.desktop-build.result }}',
              architecture: '${{ needs.architecture-tests.result }}'
            };

            const allPassed = Object.values(allJobs).every(status => status === 'success');
            const emoji = allPassed ? '✅' : '❌';
            const status = allPassed ? '通过' : '失败';

            let comment = `## ${emoji} 快速 CI 流水线${status}\n\n`;
            comment += `> 💡 这是快速CI，仅包含编译和架构测试。完整测试在夜间CI中运行。\n\n`;
            comment += `### 编译状态\n`;
            comment += `- 📦 后端编译: ${allJobs.backend === 'success' ? '✅' : '❌'}\n`;
            comment += `- 🖥️ 前端编译: ${allJobs.desktop === 'success' ? '✅' : '❌'}\n\n`;
            comment += `### 测试状态\n`;
            comment += `- 🏗️ 架构合规测试: ${allJobs.architecture === 'success' ? '✅' : '❌'}\n\n`;

            if (allPassed) {
              comment += `### ✅ 快速检查通过\n\n`;
              comment += `代码已通过编译和架构测试。完整的单元测试和集成测试将在夜间CI中运行。`;
            } else {
              comment += `### ❌ 部分检查失败\n\n`;
              comment += `请修复失败的项目后重新提交。\n\n`;
              comment += `**详细日志**: [查看完整日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            } catch (error) {
              console.log('PR comment failed (non-critical):', error.message);
            }

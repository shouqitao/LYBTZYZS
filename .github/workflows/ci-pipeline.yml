name: 完整 CI 流水线

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'

jobs:
  # Job 1: 编译后端 API
  build-backend:
    name: 📦 编译后端 API
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原后端依赖
        run: |
          dotnet restore src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj --verbosity minimal

      - name: 编译后端 API
        run: |
          dotnet build src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj -c ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

      - name: 上传后端编译产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: src/Server/Services/LYBT.WebAPI/bin/${{ env.CONFIGURATION }}
          if-no-files-found: error

  # Job 2: 编译前端 Desktop
  build-frontend:
    name: 🖥️ 编译前端 Desktop
    runs-on: windows-latest
    needs: build-backend

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 下载后端编译产物
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: src/Server/Services/LYBT.WebAPI/bin/${{ env.CONFIGURATION }}

      - name: 还原前端依赖
        run: |
          dotnet restore LYBTZYZS.sln --verbosity minimal

      - name: 编译前端 Desktop
        run: |
          dotnet build LYBTZYZS.sln -c ${{ env.CONFIGURATION }} --no-restore --verbosity minimal /p:TreatWarningsAsErrors=false /p:WarningLevel=0

      - name: 上传前端编译产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            src/Client/Desktop/**/bin/${{ env.CONFIGURATION }}
            !**/bin/**/*.pdb
          if-no-files-found: error

  # Job 3: 运行后端测试
  test-backend:
    name: 🧪 后端单元测试
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 下载后端编译产物
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: src/Server/Services/LYBT.WebAPI/bin/${{ env.CONFIGURATION }}

      - name: 编译测试项目
        run: |
          dotnet build tests/LYBT.Tests.Server/LYBT.Tests.Server.csproj -c ${{ env.CONFIGURATION }} /p:TreatWarningsAsErrors=false /p:WarningLevel=0

      - name: 运行后端单元测试
        env:
          # 测试数据库连接字符串（使用外部 SQL Server）
          ConnectionStrings__DefaultConnection: "Server=${{ secrets.SQL_SERVER_HOST }},${{ secrets.SQL_SERVER_PORT }};Database=${{ secrets.SQL_SERVER_DATABASE }};User Id=${{ secrets.SQL_SERVER_USER }};Password=${{ secrets.SQL_SERVER_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=true;"
        run: |
          dotnet test tests/LYBT.Tests.Server/LYBT.Tests.Server.csproj -c ${{ env.CONFIGURATION }} --no-build --logger "console;verbosity=normal" --logger "trx;logfilename=test-results.trx"

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/test-results.trx'

  # Job 4: 运行前端集成测试（需要运行中的 API）
  test-frontend-integration:
    name: 🎯 前端集成测试
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 下载所有编译产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 启动 WebAPI 后端（后台运行）
        run: |
          # 创建测试配置文件
          export ConnectionStrings__DefaultConnection="DataSource=:memory:"
          export ASPNETCORE_ENVIRONMENT="Testing"
          export Logging__LogLevel__Default="Warning"

          # 启动 WebAPI
          dotnet run --project src/Server/Services/LYBT.WebAPI/LYBT.WebAPI.csproj --urls http://localhost:5000 &
          API_PID=$!

          # 等待 API 启动
          echo "等待 WebAPI 启动..."
          sleep 15

          # 检查 API 是否运行
          if curl -f http://localhost:5000/health; then
            echo "✅ WebAPI 启动成功"
          else
            echo "❌ WebAPI 启动失败"
            kill $API_PID || true
            exit 1
          fi

          # 保存进程 ID 到环境变量
          echo "API_PID=$API_PID" >> $GITHUB_ENV

      - name: 运行前端集成测试
        run: |
          dotnet test tests/LYBT.Tests.Integration/LYBT.Tests.Integration.csproj -c ${{ env.CONFIGURATION }} --no-build --logger "console;verbosity=normal" --logger "trx;logfilename=integration-test-results.trx"

      - name: 停止 WebAPI
        if: always()
        run: |
          if [ -n "$API_PID" ]; then
            kill $API_PID || true
            echo "✅ WebAPI 已停止"
          fi

      - name: 上传集成测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-integration-test-results
          path: '**/integration-test-results.trx'

  # Job 5: 运行架构测试
  test-architecture:
    name: 🏗️ 架构合规测试
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 运行架构测试
        run: |
          dotnet test tests/LYBT.Tests.Architecture/LYBT.Tests.Architecture.csproj -c ${{ env.CONFIGURATION }} --logger "console;verbosity=detailed" /p:TreatWarningsAsErrors=false

  # Job 6: 汇总所有结果
  report-results:
    name: 📊 汇总测试结果
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-backend, test-frontend-integration, test-architecture]
    if: always()

    steps:
      - name: 下载所有测试结果
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: 生成测试报告
        run: |
          echo "# 📊 CI 测试结果汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 后端编译 | ${{ needs.build-backend.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ 前端编译 | ${{ needs.build-frontend.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 后端测试 | ${{ needs.test-backend.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 前端集成测试 | ${{ needs.test-frontend-integration.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ 架构测试 | ${{ needs.test-architecture.result == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY

      - name: 在 PR 中发表评论
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const allJobs = {
              backend: '${{ needs.build-backend.result }}',
              frontend: '${{ needs.build-frontend.result }}',
              backendTests: '${{ needs.test-backend.result }}',
              integrationTests: '${{ needs.test-frontend-integration.result }}',
              architecture: '${{ needs.test-architecture.result }}'
            };

            const allPassed = Object.values(allJobs).every(status => status === 'success');
            const emoji = allPassed ? '✅' : '❌';
            const status = allPassed ? '通过' : '失败';

            let comment = `## ${emoji} CI 流水线${status}\n\n`;
            comment += `### 编译状态\n`;
            comment += `- 📦 后端编译: ${allJobs.backend === 'success' ? '✅' : '❌'}\n`;
            comment += `- 🖥️ 前端编译: ${allJobs.frontend === 'success' ? '✅' : '❌'}\n\n`;
            comment += `### 测试状态\n`;
            comment += `- 🧪 后端单元测试: ${allJobs.backendTests === 'success' ? '✅' : '❌'}\n`;
            comment += `- 🎯 前端集成测试: ${allJobs.integrationTests === 'success' ? '✅' : '❌'}\n`;
            comment += `- 🏗️ 架构合规测试: ${allJobs.architecture === 'success' ? '✅' : '❌'}\n\n`;

            if (allPassed) {
              comment += `### ✅ 所有检查通过\n\n`;
              comment += `代码已通过编译和测试，可以合并。`;
            } else {
              comment += `### ❌ 部分检查失败\n\n`;
              comment += `请修复失败的项目后重新提交。\n\n`;
              comment += `**详细日志**: [查看完整日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

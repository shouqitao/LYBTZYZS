name: 夜间全量 CI

on:
  schedule:
    # 北京时间每天凌晨 02:00（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'
  SA_PASSWORD: 'YourStrong@Passw0rd'
  ConnectionStrings__DefaultConnection: 'Server=localhost,1433;Database=master;User Id=sa;Password=YourStrong@Passw0rd;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true;Connection Timeout=30;'

jobs:
  nightly-backend-tests:
    name: 🌙 夜间后端全量测试
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ env.SA_PASSWORD }}
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${{ env.SA_PASSWORD }} -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 等待 SQL Server 健康检查就绪
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' ${{ job.services.sqlserver.id }})"
            if [ "$status" = "healthy" ]; then
              echo "SQL Server is healthy."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "SQL Server failed to become healthy in time."
              docker logs ${{ job.services.sqlserver.id }}
              exit 1
            fi

            echo "Waiting for SQL Server health... attempt $i/30 (current: $status)"
            sleep 5
          done

          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -Q 'SELECT 1'

      - name: 运行后端测试（LYBT.Tests.Server）
        run: |
          dotnet test tests/LYBT.Tests.Server/LYBT.Tests.Server.csproj -c ${{ env.CONFIGURATION }} --logger "console;verbosity=normal" --logger "trx;LogFileName=server-tests.trx"

      - name: 运行集成测试（LYBT.Tests.Integration）
        run: |
          dotnet test tests/LYBT.Tests.Integration/LYBT.Tests.Integration.csproj -c ${{ env.CONFIGURATION }} --logger "console;verbosity=normal" --logger "trx;LogFileName=integration-tests.trx"

      - name: 上传 TRX 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: '**/*.trx'
          if-no-files-found: warn

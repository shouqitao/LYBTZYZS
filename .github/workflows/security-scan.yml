# 凌隐宝堂安全扫描流水线 - UltraThink重构CI/CD架构
name: Security Scanning Pipeline

on:
  schedule:
    # 每天凌晨2点运行
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ==================== 代码安全扫描 ====================
  code-security:
    name: 代码安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # 获取完整历史

    - name: 🔧 安装.NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔍 GitLeaks扫描
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔒 安全代码扫描 (Security Code Scan)
      run: |
        dotnet tool install -g security-scan
        security-scan LYBT.Backend.sln --export=security-report.sarif
      continue-on-error: true

    - name: 📤 上传SARIF结果
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: security-report.sarif
      if: always()

  # ==================== 依赖漏洞扫描 ====================
  dependency-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 安装.NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 NuGet包漏洞扫描
      run: |
        # 列出所有易受攻击的包
        dotnet list package --vulnerable --include-transitive
        
        # 生成详细报告
        dotnet list package --vulnerable --include-transitive --format json > vulnerable-packages.json
        
        # 检查是否有高危漏洞
        if [ -s vulnerable-packages.json ]; then
          echo "⚠️ 发现易受攻击的依赖包"
          cat vulnerable-packages.json
        fi

    - name: 🔍 OWASP依赖检查
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'LYBT'
        path: '.'
        format: 'ALL'
        args: >
          --enableRetired
          --enableExperimental
      continue-on-error: true

    - name: 📊 上传依赖检查报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-check-reports
        path: reports/

  # ==================== 容器镜像扫描 ====================
  container-scan:
    name: 容器镜像扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🐳 构建Docker镜像
      run: |
        docker build -t lybt/webapi:scan -f src/Backend/Services/LYBT.WebAPI/Dockerfile .

    - name: 🔍 Trivy镜像扫描
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'lybt/webapi:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        exit-code: '0'

    - name: 📤 上传Trivy结果
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()

    - name: 🔐 Snyk容器扫描
      uses: snyk/actions/docker@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: lybt/webapi:scan
        args: --severity-threshold=high
      continue-on-error: true

  # ==================== 基础设施安全扫描 ====================
  infrastructure-scan:
    name: 基础设施安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔍 Terraform安全扫描
      uses: triat/terraform-security-scan@v3
      with:
        tfsec_actions_comment: true
        tfsec_actions_working_dir: ./terraform
      if: hashFiles('terraform/**') != ''
      continue-on-error: true

    - name: 🔒 Kubernetes配置扫描
      uses: controlplaneio/kubesec-action@v0.0.2
      with:
        input: deployment/**/*.yaml
      if: hashFiles('deployment/**/*.yaml') != ''
      continue-on-error: true

    - name: 📝 Docker Compose安全检查
      run: |
        # 检查Docker Compose文件中的安全问题
        for file in $(find . -name "docker-compose*.yml"); do
          echo "检查 $file"
          
          # 检查是否使用了特权模式
          if grep -q "privileged: true" "$file"; then
            echo "⚠️ 警告: $file 使用了特权模式"
          fi
          
          # 检查是否暴露了敏感端口
          if grep -E "3306|5432|6379|27017" "$file"; then
            echo "⚠️ 警告: $file 可能暴露了数据库端口"
          fi
          
          # 检查是否有硬编码的密码
          if grep -E "password|secret|token" "$file" | grep -v "{{" | grep -v "\${"; then
            echo "⚠️ 警告: $file 可能包含硬编码的敏感信息"
          fi
        done

  # ==================== SAST静态应用安全测试 ====================
  sast-scan:
    name: SAST静态安全测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔍 Semgrep扫描
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/csharp
          p/owasp-top-ten
          p/r2c-security-audit
      continue-on-error: true

    - name: 🔒 CodeQL分析
      uses: github/codeql-action/analyze@v2
      with:
        languages: csharp
        queries: security-and-quality

  # ==================== 许可证合规性检查 ====================
  license-check:
    name: 许可证合规性检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 📜 许可证扫描
      uses: fossas/fossa-action@main
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
      continue-on-error: true

    - name: 🔍 许可证合规性检查
      run: |
        # 安装license-checker
        npm install -g license-checker
        
        # 检查前端项目许可证
        if [ -f "src/Frontend/package.json" ]; then
          cd src/Frontend
          license-checker --summary --excludePrivatePackages
          cd ../..
        fi
        
        # 检查.NET项目许可证
        dotnet tool install -g dotnet-project-licenses
        dotnet-project-licenses -i LYBT.Backend.sln

  # ==================== 安全报告汇总 ====================
  security-report:
    name: 安全报告汇总
    runs-on: ubuntu-latest
    needs: [code-security, dependency-scan, container-scan, infrastructure-scan, sast-scan, license-check]
    if: always()
    
    steps:
    - name: 📥 下载所有报告
      uses: actions/download-artifact@v3

    - name: 📊 生成汇总报告
      run: |
        echo "# 安全扫描报告" > security-summary.md
        echo "扫描时间: $(date)" >> security-summary.md
        echo "" >> security-summary.md
        
        echo "## 扫描结果汇总" >> security-summary.md
        echo "| 扫描项目 | 状态 |" >> security-summary.md
        echo "|----------|------|" >> security-summary.md
        echo "| 代码安全扫描 | ${{ needs.code-security.result }} |" >> security-summary.md
        echo "| 依赖漏洞扫描 | ${{ needs.dependency-scan.result }} |" >> security-summary.md
        echo "| 容器镜像扫描 | ${{ needs.container-scan.result }} |" >> security-summary.md
        echo "| 基础设施扫描 | ${{ needs.infrastructure-scan.result }} |" >> security-summary.md
        echo "| SAST扫描 | ${{ needs.sast-scan.result }} |" >> security-summary.md
        echo "| 许可证检查 | ${{ needs.license-check.result }} |" >> security-summary.md
        
        # 判断整体状态
        if [[ "${{ needs.code-security.result }}" == "failure" ]] || \
           [[ "${{ needs.dependency-scan.result }}" == "failure" ]] || \
           [[ "${{ needs.container-scan.result }}" == "failure" ]]; then
          echo "" >> security-summary.md
          echo "⚠️ **发现安全问题，请立即处理！**" >> security-summary.md
          SECURITY_STATUS="critical"
        else
          echo "" >> security-summary.md
          echo "✅ **未发现严重安全问题**" >> security-summary.md
          SECURITY_STATUS="ok"
        fi
        
        echo "security_status=$SECURITY_STATUS" >> $GITHUB_ENV

    - name: 📤 上传安全报告
      uses: actions/upload-artifact@v3
      with:
        name: security-summary
        path: security-summary.md

    - name: 💬 发送安全通知
      if: env.security_status == 'critical'
      run: |
        curl -X POST ${{ secrets.SECURITY_WEBHOOK }} \
          -H 'Content-Type: application/json' \
          -d '{
            "text": "🔒 安全扫描发现问题",
            "attachments": [{
              "color": "danger",
              "title": "安全扫描报告",
              "text": "在最新的安全扫描中发现了潜在的安全问题，请立即查看并处理。",
              "fields": [
                {"title": "分支", "value": "${{ github.ref_name }}", "short": true},
                {"title": "提交", "value": "${{ github.sha }}", "short": true},
                {"title": "触发者", "value": "${{ github.actor }}", "short": true},
                {"title": "时间", "value": "$(date)", "short": true}
              ],
              "actions": [{
                "type": "button",
                "text": "查看详情",
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }]
          }'

    - name: 🚫 创建Issue（如果发现严重问题）
      if: env.security_status == 'critical'
      uses: actions/github-script@v8
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🔒 安全扫描发现问题',
            body: `安全扫描在 ${context.sha} 提交中发现了潜在的安全问题。
            
            请查看 [扫描结果](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            
            **需要关注的项目:**
            - 代码安全: ${{ needs.code-security.result }}
            - 依赖漏洞: ${{ needs.dependency-scan.result }}
            - 容器安全: ${{ needs.container-scan.result }}
            
            请尽快处理这些安全问题。`,
            labels: ['security', 'high-priority']
          })
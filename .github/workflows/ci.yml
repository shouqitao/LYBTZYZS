name: 持续集成 (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: 构建和测试
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # 获取完整历史记录以支持代码覆盖率分析

    - name: 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 还原依赖包
      run: dotnet restore LYBT.All.sln

    - name: 构建解决方案
      run: dotnet build LYBT.All.sln --configuration Release --no-restore

    - name: 运行单元测试
      run: |
        dotnet test tests/Backend/LYBT.Module.Users.Tests/LYBT.Module.Users.Tests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --logger "trx;LogFileName=user-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults
        
        dotnet test tests/Backend/LYBT.Module.Patients.Tests/LYBT.Module.Patients.Tests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --logger "trx;LogFileName=patient-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults
        
        dotnet test tests/Backend/LYBT.Module.Herbs.Tests/LYBT.Module.Herbs.Tests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --logger "trx;LogFileName=herb-tests.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          --results-directory ./TestResults

    - name: 运行集成测试
      run: |
        dotnet test tests/Integration/LYBT.IntegrationTests/LYBT.IntegrationTests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --logger "trx;LogFileName=integration-tests.trx" `
          --logger "console;verbosity=detailed" `
          --results-directory ./TestResults

    - name: 上传测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults
        retention-days: 30

    - name: 发布测试报告
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: .NET 测试报告
        path: './TestResults/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: 生成代码覆盖率报告
      if: always()
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        reportgenerator `
          -reports:"./TestResults/**/coverage.cobertura.xml" `
          -targetdir:"./CoverageReport" `
          -reporttypes:"Html;Cobertura;MarkdownSummary"

    - name: 上传覆盖率报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: ./CoverageReport
        retention-days: 30

    - name: 显示覆盖率摘要
      if: always()
      run: |
        if (Test-Path "./CoverageReport/Summary.md") {
          Get-Content "./CoverageReport/Summary.md"
        }

  code-quality:
    name: 代码质量检查
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5

    - name: 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 安装代码分析工具
      run: |
        dotnet tool install --global dotnet-format
        dotnet tool install --global security-scan

    - name: 运行代码格式检查
      run: dotnet format LYBT.All.sln --verify-no-changes --verbosity diagnostic

    - name: 运行安全扫描
      run: security-scan LYBT.All.sln
      continue-on-error: true

  publish-artifacts:
    name: 发布构建产物
    runs-on: windows-latest
    needs: [build-and-test, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v5

    - name: 设置 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 还原依赖包
      run: dotnet restore LYBT.All.sln

    - name: 发布 Web API
      run: |
        dotnet publish src/Backend/Services/LYBT.WebAPI/LYBT.WebAPI.csproj `
          --configuration Release `
          --output ./publish/api `
          --no-restore

    - name: 发布 WPF 客户端
      run: |
        dotnet publish src/Frontend/Desktop/Shell/LYBT.WPF.Client.Shell.csproj `
          --configuration Release `
          --output ./publish/desktop `
          --no-restore `
          --self-contained true `
          --runtime win-x64

    - name: 创建部署包
      run: |
        Compress-Archive -Path ./publish/api/* -DestinationPath ./LYBT-API-${{ github.sha }}.zip
        Compress-Archive -Path ./publish/desktop/* -DestinationPath ./LYBT-Desktop-${{ github.sha }}.zip

    - name: 上传部署包
      uses: actions/upload-artifact@v4
      with:
        name: deployment-packages
        path: |
          ./LYBT-API-${{ github.sha }}.zip
          ./LYBT-Desktop-${{ github.sha }}.zip
        retention-days: 90

  notification:
    name: 发送通知
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, publish-artifacts]
    if: always()
    
    steps:
    - name: 构建状态总结
      run: |
        echo "## 构建状态总结" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- 构建和测试: ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 代码质量: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 发布产物: ${{ needs.publish-artifacts.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "分支: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "触发者: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
# 凌隐宝堂后端CI流水线 - UltraThink重构CI/CD架构
name: Backend CI Pipeline

on:
  push:
    branches: [ main, develop, release/* ]
    paths:
      - 'src/Backend/**'
      - 'src/Shared/**'
      - 'tests/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/Backend/**'
      - 'src/Shared/**'
      - 'tests/**'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ==================== 代码质量检查 ====================
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # 获取完整历史用于SonarCloud分析

    - name: 🔧 安装.NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 恢复依赖缓存
      uses: actions/cache@v3
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 🔍 代码格式检查
      run: |
        dotnet tool install -g dotnet-format
        dotnet format LYBT.Backend.sln --verify-no-changes --verbosity diagnostic

    - name: 🐛 静态代码分析
      run: |
        dotnet tool install -g dotnet-sonarscanner
        dotnet sonarscanner begin /k:"lybt-backend" /o:"lybt" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io"
        dotnet build LYBT.Backend.sln --configuration Release
        dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
      continue-on-error: true  # SonarCloud可选

    - name: 🔒 安全漏洞扫描
      run: |
        dotnet list package --vulnerable --include-transitive
        dotnet tool install -g security-scan
        security-scan LYBT.Backend.sln
      continue-on-error: true

  # ==================== 构建和测试 ====================
  build-and-test:
    name: 构建和测试
    runs-on: ${{ matrix.os }}
    needs: code-quality
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
        
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 安装.NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 恢复依赖缓存
      uses: actions/cache@v3
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 📚 恢复NuGet包
      run: dotnet restore LYBT.Backend.sln

    - name: 🔨 构建项目
      run: dotnet build LYBT.Backend.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: 🧪 运行单元测试
      run: |
        dotnet test tests/LYBT.Tests.Unit/LYBT.Tests.Unit.csproj \
          --configuration ${{ matrix.configuration }} \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=unit-test-results.trx" \
          --logger "html;LogFileName=unit-test-results.html" \
          --collect:"XPlat Code Coverage" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: 🧪 运行集成测试
      run: |
        dotnet test tests/LYBT.Tests.Integration/LYBT.Tests.Integration.csproj \
          --configuration ${{ matrix.configuration }} \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=integration-test-results.trx" \
          --logger "html;LogFileName=integration-test-results.html"
      if: matrix.configuration == 'Release'

    - name: 📊 上传测试结果
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
        path: |
          **/*.trx
          **/*.html
          **/coverage.opencover.xml

    - name: 📈 发布代码覆盖率
      uses: codecov/codecov-action@v5
      if: matrix.configuration == 'Release' && matrix.os == 'ubuntu-latest'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.opencover.xml'
        flags: backend
        name: backend-coverage

  # ==================== 性能测试 ====================
  performance-test:
    name: 性能测试
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🔧 安装.NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔨 构建Release版本
      run: |
        dotnet restore LYBT.Backend.sln
        dotnet build LYBT.Backend.sln --configuration Release

    - name: 🎯 运行性能测试
      run: |
        dotnet tool install -g NBomber.Runner
        nbomber-runner run tests/LYBT.Tests.Performance/scenarios.json
      continue-on-error: true

    - name: 📊 上传性能测试报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: tests/LYBT.Tests.Performance/reports/

  # ==================== Docker镜像构建 ====================
  docker-build:
    name: Docker镜像构建
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🐳 设置Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔑 登录Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    - name: 📝 提取元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          lybt/webapi
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🏗️ 构建并推送Docker镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/Backend/Services/LYBT.WebAPI/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ steps.meta.outputs.version }}

    - name: 🔍 扫描镜像安全漏洞
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: lybt/webapi:${{ steps.meta.outputs.version }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      if: github.ref == 'refs/heads/main'

    - name: 📤 上传安全扫描结果
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      if: github.ref == 'refs/heads/main'

  # ==================== 发布准备 ====================
  prepare-release:
    name: 准备发布
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v5

    - name: 🏷️ 计算版本号
      id: version
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          VERSION="latest"
        elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#release/}"
        else
          VERSION="dev"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: 📦 创建发布包
      run: |
        dotnet publish src/Backend/Services/LYBT.WebAPI/LYBT.WebAPI.csproj \
          --configuration Release \
          --output ./publish \
          --runtime linux-x64 \
          --self-contained false

    - name: 🗜️ 压缩发布包
      run: |
        tar -czf lybt-backend-${{ steps.version.outputs.version }}.tar.gz -C ./publish .
        zip -r lybt-backend-${{ steps.version.outputs.version }}.zip ./publish/*

    - name: 📤 上传发布包
      uses: actions/upload-artifact@v3
      with:
        name: release-packages
        path: |
          *.tar.gz
          *.zip

  # ==================== 通知 ====================
  notify:
    name: 发送通知
    runs-on: ubuntu-latest
    needs: [code-quality, build-and-test, docker-build]
    if: always()
    
    steps:
    - name: 📧 发送构建通知
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Backend CI Pipeline ${{ job.status }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()

    - name: 💬 发送企业微信通知
      run: |
        curl -X POST ${{ secrets.WECHAT_WEBHOOK }} \
          -H 'Content-Type: application/json' \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "## Backend CI Pipeline\n
              > 状态: ${{ job.status }}\n
              > 分支: ${{ github.ref_name }}\n
              > 提交: ${{ github.sha }}\n
              > 作者: ${{ github.actor }}\n
              > [查看详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            }
          }'
      if: always() && env.WECHAT_WEBHOOK != ''
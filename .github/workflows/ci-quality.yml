# 代码质量与架构合规门禁 - Issue #933 CI 重构
# 合并自: ci.yml (Level 3), governance.yml
name: CI - Quality & Architecture

on:
  push:
    branches: [ master, main, develop, 'chore/pass3-*' ]
    paths:
      - 'src/**'
      - 'tests/Architecture/**'
      - '.ai/rules.json'
      - '_governance/**'
      - '.github/workflows/ci-quality.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'src/**'
      - 'tests/Architecture/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ==================== 治理规则验证 ====================
  governance-validation:
    name: 治理规则验证
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔍 检查治理文件存在性
      shell: bash
      run: |
        echo "🔍 Checking governance files..."

        if [[ ! -f ".ai/rules.json" ]]; then
          echo "❌ Missing .ai/rules.json"
          exit 1
        fi

        if [[ ! -f "_governance/architecture.md" ]]; then
          echo "❌ Missing _governance/architecture.md"
          exit 1
        fi

        echo "✅ Governance files present"

    - name: 🔍 验证 rules.json 结构
      shell: bash
      run: |
        echo "🔍 Validating rules.json structure..."

        if ! jq -e '.projectRules.type == "record-only-system"' .ai/rules.json >/dev/null; then
          echo "❌ Invalid project type in rules.json"
          exit 1
        fi

        echo "✅ Record-Only system principle confirmed"

    - name: 📋 显示治理规则摘要
      shell: bash
      run: |
        echo "## 🔒 治理规则摘要" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚫 禁止框架" >> $GITHUB_STEP_SUMMARY
        jq -r '.prohibitions.frameworks[] | "- ❌ " + .' .ai/rules.json >> $GITHUB_STEP_SUMMARY || echo "- (无数据)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚫 禁止命名" >> $GITHUB_STEP_SUMMARY
        jq -r '.prohibitions.naming[] | "- ❌ " + .' .ai/rules.json >> $GITHUB_STEP_SUMMARY || echo "- (无数据)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Record-Only 系统原则已强制执行" >> $GITHUB_STEP_SUMMARY

  # ==================== 架构合规测试 ====================
  architecture-compliance:
    name: 架构合规测试
    runs-on: windows-latest
    needs: governance-validation

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🔧 设置 .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 缓存 NuGet 包
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 📚 恢复 ArchTests 依赖
      run: dotnet restore tests/Architecture/LYBT.ArchTests.csproj

    - name: 🔨 构建 ArchTests
      run: dotnet build tests/Architecture/LYBT.ArchTests.csproj --configuration Release --no-restore

    - name: 🏗️ 执行架构合规测试
      shell: bash
      run: |
        echo "🏗️ Running Architecture Tests..."

        if dotnet test tests/Architecture/LYBT.ArchTests.csproj \
          --configuration Release --no-build \
          --verbosity normal \
          --logger "console;verbosity=detailed"; then
          echo "✅ All architectural rules compliance verified"
        else
          echo "❌ Architectural compliance violations detected"
          echo "::error::Critical governance violations found"
          exit 1
        fi

    - name: 🚨 层间依赖检查
      run: |
        echo "检查层间依赖..."
        dotnet test tests/Architecture/LYBT.ArchTests.csproj `
          --filter "FullyQualifiedName~LayerDependencyTests" `
          --configuration Release --no-build --verbosity minimal

    - name: 🚨 API 版本合规检查
      run: |
        echo "检查 API 版本控制..."
        dotnet test tests/Architecture/LYBT.ArchTests.csproj `
          --filter "FullyQualifiedName~ApiVersionTests" `
          --configuration Release --no-build --verbosity minimal

    - name: 🚨 控制器位置检查
      run: |
        echo "检查控制器位置..."
        dotnet test tests/Architecture/LYBT.ArchTests.csproj `
          --filter "FullyQualifiedName~ControllerLocationTests" `
          --configuration Release --no-build --verbosity minimal

    - name: 🚨 命名规范检查
      run: |
        echo "检查命名规范..."
        dotnet test tests/Architecture/LYBT.ArchTests.csproj `
          --filter "FullyQualifiedName~NamingConventionTests" `
          --configuration Release --no-build --verbosity minimal

    - name: 🚨 禁止框架检查
      run: |
        echo "检查禁止框架使用..."
        dotnet test tests/Architecture/LYBT.ArchTests.csproj `
          --filter "FullyQualifiedName~ForbiddenFrameworkTests" `
          --configuration Release --no-build --verbosity minimal

    - name: 🚨 Record-Only 功能模式检查
      run: |
        echo "检查 Record-Only 基线..."
        dotnet test tests/Architecture/LYBT.ArchTests.csproj `
          --filter "FullyQualifiedName~RecordOnlyTests" `
          --configuration Release --no-build --verbosity minimal

  # ==================== 质量门禁总结 ====================
  quality-gate-summary:
    name: ✅ 质量门禁验证通过
    runs-on: windows-latest
    needs: [governance-validation, architecture-compliance]
    if: success()

    steps:
    - name: 质量门禁成功
      shell: bash
      run: |
        echo "## ✅ 代码质量与架构合规验证通过" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔒 核心治理规则" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Record-Only System: Enforced via ArchTests" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ API Route Prefix (/api/v1): Validated" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Layer Dependencies: Checked" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Naming Conventions: Monitored" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Module Boundaries: Enforced" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ 业务约束" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ 8 Business Modules: Record + Historical Query Only" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ No AI/ML Integration" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ No Complex Workflows" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ No Event-Driven Architecture" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**提交信息**:" >> $GITHUB_STEP_SUMMARY
        echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- 分支: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- 提交者: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  quality-gate-failed:
    name: ❌ 质量门禁验证失败
    runs-on: windows-latest
    needs: [governance-validation, architecture-compliance]
    if: failure()

    steps:
    - name: 质量门禁失败
      shell: bash
      run: |
        echo "## ❌ 代码质量与架构合规验证失败" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**PR 被自动阻塞** - 必须修复所有违规项" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**失败状态**:" >> $GITHUB_STEP_SUMMARY
        echo "- 治理规则验证: ${{ needs.governance-validation.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- 架构合规测试: ${{ needs.architecture-compliance.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**修复指导**:" >> $GITHUB_STEP_SUMMARY
        echo "1. 检查治理文件是否存在 (.ai/rules.json, _governance/architecture.md)" >> $GITHUB_STEP_SUMMARY
        echo "2. 修复架构测试失败项" >> $GITHUB_STEP_SUMMARY
        echo "3. 遵循 Record-Only 基线约束" >> $GITHUB_STEP_SUMMARY
        echo "4. 确保不使用禁止框架 (CQRS/MediatR/Redis/Docker/K8s 等)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "详细错误信息请查看上方构建日志" >> $GITHUB_STEP_SUMMARY
        exit 1
